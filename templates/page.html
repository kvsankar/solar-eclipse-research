<!doctype html>
<html lang="en" data-theme-default="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{head_title}}</title>
<meta name="description" content="{{description}}">
{{social}}
<link rel="stylesheet" href="{{root}}assets/site.css?v={{v_css}}">
</head>
<body data-root="{{root}}">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="{{root}}{{home_url}}">{{site_title}}</a>
  <button id="navtoggle" class="navtoggle" aria-expanded="false" aria-label="Menu" title="Menu"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button id="themetoggle" class="themetoggle" aria-label="Theme" title="Theme"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Site navigation">
{{nav}}
  </nav>
  <main id="main">
    <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
    <div class="{{colwrap_class}}">
      <article class="doc">
        <h1 class="doctitle">{{title}}</h1>
        {{meta_block}}
        {{body}}
      </article>
      {{toc_rail}}
    </div>
    {{children}}
    {{prevnext}}
    <footer class="pagefoot">
      <p>{{source_note}}</p>
    </footer>
  </main>
</div>
<script src="{{root}}assets/site.js?v={{v_js}}"></script>
<script src="{{root}}assets/site3d.js?v={{v_3d}}" data-geometry-v="{{v_geo}}" data-scenes-v="{{v_scenes}}"></script>
</body>
</html>
