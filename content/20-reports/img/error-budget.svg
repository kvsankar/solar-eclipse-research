<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" role="img" class="figsvg"><title>The ranked error budget, as position error at an eclipse limit</title><desc>A horizontal bar chart on a logarithmic axis running from one metre to ten kilometres. Twenty-two terms from the error budget are ranked from largest to smallest. Two implementation bugs head the list at tens of kilometres: a geometric Sun paired with an apparent Moon at 38 km and TT used where UT belongs at 32 km, with a sphere used instead of the ellipsoid at 21 km behind them. Three shaded bars follow at kilometre scale and are the terms the corpus calls dominant: terrain omitted at up to 3 km, the lunar limb omitted at 1 to 3 km, and the choice of solar radius at 600 m. Below them the lunar radius constant, lunar light-time, the centre-of-figure offset and the delta T prediction error lie between 400 m and 1.4 km. Everything else falls under 200 m, and the ephemeris terms at the foot of the chart are between 16 m and under a metre.</desc><line x1="321.44" y1="30" x2="321.44" y2="400" class="rule thin dotted"/><text x="321.44" y="414" text-anchor="middle" class="tick">1 m</text><line x1="391.04" y1="30" x2="391.04" y2="400" class="rule thin dotted"/><text x="391.04" y="414" text-anchor="middle" class="tick">10 m</text><line x1="460.64" y1="30" x2="460.64" y2="400" class="rule thin dotted"/><text x="460.64" y="414" text-anchor="middle" class="tick">100 m</text><line x1="530.24" y1="30" x2="530.24" y2="400" class="rule thin dotted"/><text x="530.24" y="414" text-anchor="middle" class="tick">1 km</text><line x1="599.84" y1="30" x2="599.84" y2="400" class="rule thin dotted"/><text x="599.84" y="414" text-anchor="middle" class="tick">10 km</text><line x1="306" y1="400" x2="654" y2="400" class="rule"/><rect x="306" y="39.5" width="334.19" height="9" class="cone"/><rect x="306" y="39.5" width="334.19" height="9" class="rule thin"/><text x="646.19" y="48" text-anchor="start" class="tick">38 km</text><text x="6" y="48" text-anchor="start" class="tick">1</text><text x="300" y="48" text-anchor="end" class="label">Geometric Sun with apparent Moon</text><rect x="306" y="55.5" width="329" height="9" class="cone"/><rect x="306" y="55.5" width="329" height="9" class="rule thin"/><text x="641" y="64" text-anchor="start" class="tick">32 km</text><text x="6" y="64" text-anchor="start" class="tick">2</text><text x="300" y="64" text-anchor="end" class="label">TT used as UT</text><rect x="306" y="71.5" width="316.27" height="9" class="cone"/><rect x="306" y="71.5" width="316.27" height="9" class="rule thin"/><text x="628.27" y="80" text-anchor="start" class="tick">up to 21 km</text><text x="6" y="80" text-anchor="start" class="tick">3</text><text x="300" y="80" text-anchor="end" class="label">Sphere instead of ellipsoid</text><rect x="306" y="87.5" width="257.45" height="9" class="accent-fill"/><rect x="306" y="87.5" width="257.45" height="9" class="rule thin"/><text x="569.45" y="96" text-anchor="start" class="tick">up to 3 km</text><text x="6" y="96" text-anchor="start" class="tick">4</text><text x="300" y="96" text-anchor="end" class="label-accent">▸ Terrain omitted</text><rect x="306" y="103.5" width="257.45" height="9" class="accent-fill"/><rect x="306" y="103.5" width="257.45" height="9" class="rule thin"/><line x1="530.24" y1="101" x2="530.24" y2="115" class="rule"/><text x="569.45" y="112" text-anchor="start" class="tick">1 to 3 km</text><text x="6" y="112" text-anchor="start" class="tick">5</text><text x="300" y="112" text-anchor="end" class="label-accent">▸ Lunar limb omitted</text><rect x="306" y="119.5" width="234.41" height="9" class="cone"/><rect x="306" y="119.5" width="234.41" height="9" class="rule thin"/><text x="546.41" y="128" text-anchor="start" class="tick">1.4 km</text><text x="6" y="128" text-anchor="start" class="tick">7</text><text x="300" y="128" text-anchor="end" class="label">Lunar radius k, umbral, IAU value</text><rect x="306" y="135.5" width="232.17" height="9" class="cone"/><rect x="306" y="135.5" width="232.17" height="9" class="rule thin"/><text x="544.17" y="144" text-anchor="start" class="tick">1.3 km</text><text x="6" y="144" text-anchor="start" class="tick">19</text><text x="300" y="144" text-anchor="end" class="label">Moon light-time omitted</text><rect x="306" y="151.5" width="224.24" height="9" class="cone"/><rect x="306" y="151.5" width="224.24" height="9" class="rule thin"/><line x1="509.29" y1="149" x2="509.29" y2="163" class="rule"/><text x="536.24" y="160" text-anchor="start" class="tick">0.5 to 1 km</text><text x="6" y="160" text-anchor="start" class="tick">9</text><text x="300" y="160" text-anchor="end" class="label">Centre of figure against centre of mass</text><rect x="306" y="167.5" width="217.5" height="9" class="cone"/><rect x="306" y="167.5" width="217.5" height="9" class="rule thin"/><line x1="509.29" y1="165" x2="509.29" y2="179" class="rule"/><text x="529.5" y="176" text-anchor="start" class="tick">500 to 800 m</text><text x="6" y="176" text-anchor="start" class="tick">8</text><text x="300" y="176" text-anchor="end" class="label">ΔT prediction error, realised in 2024</text><rect x="306" y="183.5" width="215.54" height="9" class="cone"/><rect x="306" y="183.5" width="215.54" height="9" class="rule thin"/><line x1="514.8" y1="181" x2="514.8" y2="195" class="rule"/><text x="527.54" y="192" text-anchor="start" class="tick">600 to 750 m</text><text x="6" y="192" text-anchor="start" class="tick">10</text><text x="300" y="192" text-anchor="end" class="label">Watts-era limb data</text><rect x="306" y="199.5" width="208.8" height="9" class="accent-fill"/><rect x="306" y="199.5" width="208.8" height="9" class="rule thin"/><text x="520.8" y="208" text-anchor="start" class="tick">600 m</text><text x="6" y="208" text-anchor="start" class="tick">6</text><text x="300" y="208" text-anchor="end" class="label-accent">▸ Solar radius 959.63″ against 959.95″</text><rect x="306" y="215.5" width="203.29" height="9" class="cone"/><rect x="306" y="215.5" width="203.29" height="9" class="rule thin"/><text x="515.29" y="224" text-anchor="start" class="tick">up to 500 m</text><text x="6" y="224" text-anchor="start" class="tick">17</text><text x="300" y="224" text-anchor="end" class="label">Sidereal time, mean against apparent</text><rect x="306" y="231.5" width="198.02" height="9" class="cone"/><rect x="306" y="231.5" width="198.02" height="9" class="rule thin"/><text x="510.02" y="240" text-anchor="start" class="tick">up to 420 m</text><text x="6" y="240" text-anchor="start" class="tick">18</text><text x="300" y="240" text-anchor="end" class="label">UT1 against UTC</text><rect x="306" y="247.5" width="170.68" height="9" class="cone"/><rect x="306" y="247.5" width="170.68" height="9" class="rule thin"/><text x="482.68" y="256" text-anchor="start" class="tick">up to 170 m</text><text x="6" y="256" text-anchor="start" class="tick">11</text><text x="300" y="256" text-anchor="end" class="label">Geoid against ellipsoid height</text><rect x="306" y="263.5" width="162.57" height="9" class="cone"/><rect x="306" y="263.5" width="162.57" height="9" class="rule thin"/><line x1="445.2" y1="261" x2="445.2" y2="275" class="rule"/><text x="474.57" y="272" text-anchor="start" class="tick">60 to 130 m</text><text x="6" y="272" text-anchor="start" class="tick">12</text><text x="300" y="272" text-anchor="end" class="label">Implementation spread, identical inputs</text><rect x="306" y="279.5" width="154.64" height="9" class="cone"/><rect x="306" y="279.5" width="154.64" height="9" class="rule thin"/><text x="466.64" y="288" text-anchor="start" class="tick">100 m band</text><text x="6" y="288" text-anchor="start" class="tick">13</text><text x="300" y="288" text-anchor="end" class="label">Solar radius residual, ± 0.05″</text><rect x="306" y="295.5" width="105.99" height="9" class="cone"/><rect x="306" y="295.5" width="105.99" height="9" class="rule thin"/><text x="417.99" y="304" text-anchor="start" class="tick">under 20 m</text><text x="6" y="304" text-anchor="start" class="tick">24</text><text x="300" y="304" text-anchor="end" class="label">Nutation, 1980 against 2000A</text><rect x="306" y="311.5" width="99.25" height="9" class="cone"/><rect x="306" y="311.5" width="99.25" height="9" class="rule thin"/><text x="411.25" y="320" text-anchor="start" class="tick">16 m</text><text x="6" y="320" text-anchor="start" class="tick">21</text><text x="300" y="320" text-anchor="end" class="label">Ephemeris, DE403 to DE421, at 2020</text><rect x="306" y="327.5" width="85.04" height="9" class="cone"/><rect x="306" y="327.5" width="85.04" height="9" class="rule thin"/><text x="397.04" y="336" text-anchor="start" class="tick">10 m</text><text x="6" y="336" text-anchor="start" class="tick">22</text><text x="300" y="336" text-anchor="end" class="label">ELP-2000/82 truncated as in the Canon</text><rect x="306" y="343.5" width="85.04" height="9" class="cone"/><rect x="306" y="343.5" width="85.04" height="9" class="rule thin"/><text x="397.04" y="352" text-anchor="start" class="tick">about 10 m</text><text x="6" y="352" text-anchor="start" class="tick">23</text><text x="300" y="352" text-anchor="end" class="label">Polar motion</text><rect x="306" y="359.5" width="36.39" height="9" class="cone"/><rect x="306" y="359.5" width="36.39" height="9" class="rule thin"/><text x="348.39" y="368" text-anchor="start" class="tick">2 m</text><text x="6" y="368" text-anchor="start" class="tick">25</text><text x="300" y="368" text-anchor="end" class="label">TT against TDB</text><rect x="306" y="375.5" width="12.26" height="9" class="cone"/><rect x="306" y="375.5" width="12.26" height="9" class="rule thin"/><text x="324.26" y="384" text-anchor="start" class="tick">under 1 m</text><text x="6" y="384" text-anchor="start" class="tick">20</text><text x="300" y="384" text-anchor="end" class="label">Ephemeris, DE421 to DE440</text><text x="480" y="18" text-anchor="middle" class="label-dim">edge position error, metres, log scale</text><text x="6" y="24" text-anchor="start" class="label-dim">rank</text><text x="300" y="24" text-anchor="end" class="label-dim">term, as the error budget ranks it</text><rect x="6" y="436" width="16" height="8" class="accent-fill"/><text x="28" y="443" text-anchor="start" class="label-dim">▸ the three terms the corpus calls dominant. A tick inside a bar marks the low end of a stated range.</text></svg>
