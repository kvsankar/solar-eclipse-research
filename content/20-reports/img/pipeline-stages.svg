<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 706" role="img" class="figsvg"><title>The nine-stage eclipse computation pipeline</title><desc>A flow chart read from top to bottom. A configuration record sits above everything, followed by stage 1, the ephemeris, orientation and time layer, which spans the full width. Below it the flow splits in two. The left column is the elements path: stage 2 enumeration, stage 3 Besselian elements, stage 4 global circumstances, stage 5 partial-eclipse maps and stage 6 local circumstances. The right column is a single dashed box, the direct topocentric path, which root-finds on apparent topocentric places and takes no Besselian elements. An arrow leads from it back into stage 6, labelled as a cross-check the two paths must pass to 0.1 seconds. Below stage 6 the flow is one column again: stage 7 terrain, stage 8 lunar limb and stage 9 products with uncertainty. A bracket down the left edge marks stages 1 to 6 as almanac mode and stages 7 and 8 as what edge mode adds; stage 9 belongs to both.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><rect x="52" y="56" width="672" height="40" rx="4" class="rule dotted"/><text x="66" y="73" text-anchor="start" class="label">Configuration record, fixed before stage 1 and printed with every product</text><text x="66" y="87" text-anchor="start" class="label-dim">ephemeris, lunar orientation, ellipsoid, s₀, k₁, k₂, terrain, ΔT, time scale, refraction</text><line x1="241" y1="96" x2="241" y2="120" class="axis" marker-end="url(#arrow)"/><rect x="52" y="124" width="672" height="40" rx="4" class="cone"/><rect x="52" y="124" width="672" height="40" rx="4" class="rule"/><text x="66" y="149" text-anchor="start" class="label-accent">1</text><text x="82" y="141" text-anchor="start" class="label">Ephemeris, orientation and time</text><text x="82" y="155" text-anchor="start" class="label-dim">apparent places of Sun and Moon, sidereal time, topocentric libration, ΔT as metadata</text><line x1="241" y1="164" x2="241" y2="196" class="axis" marker-end="url(#arrow)"/><text x="249" y="186" text-anchor="start" class="label-dim">elements path</text><line x1="597" y1="164" x2="597" y2="256" class="axis" marker-end="url(#arrow)"/><text x="589" y="194" text-anchor="end" class="label-dim">direct topocentric path</text><rect x="52" y="200" width="378" height="40" rx="4" class="cone"/><rect x="52" y="200" width="378" height="40" rx="4" class="rule"/><text x="66" y="225" text-anchor="start" class="label-accent">2</text><text x="82" y="217" text-anchor="start" class="label">Enumeration and provisional type</text><text x="82" y="231" text-anchor="start" class="label-dim">lunations, γ and u, type, Saros</text><line x1="241" y1="240" x2="241" y2="256" class="axis" marker-end="url(#arrow)"/><rect x="52" y="260" width="378" height="40" rx="4" class="cone"/><rect x="52" y="260" width="378" height="40" rx="4" class="rule"/><text x="66" y="285" text-anchor="start" class="label-accent">3</text><text x="82" y="277" text-anchor="start" class="label">Besselian elements</text><text x="82" y="291" text-anchor="start" class="label-dim">x, y, d, μ, l₁, l₂, tan f₁, tan f₂</text><line x1="241" y1="300" x2="241" y2="316" class="axis" marker-end="url(#arrow)"/><rect x="52" y="320" width="378" height="40" rx="4" class="cone"/><rect x="52" y="320" width="378" height="40" rx="4" class="rule"/><text x="66" y="345" text-anchor="start" class="label-accent">4</text><text x="82" y="337" text-anchor="start" class="label">Global circumstances, smooth Moon</text><text x="82" y="351" text-anchor="start" class="label-dim">central line, limits, durations, width</text><line x1="241" y1="360" x2="241" y2="376" class="axis" marker-end="url(#arrow)"/><rect x="52" y="380" width="378" height="40" rx="4" class="cone"/><rect x="52" y="380" width="378" height="40" rx="4" class="rule"/><text x="66" y="405" text-anchor="start" class="label-accent">5</text><text x="82" y="397" text-anchor="start" class="label">Partial-eclipse maps</text><text x="82" y="411" text-anchor="start" class="label-dim">magnitude and obscuration contours</text><line x1="241" y1="420" x2="241" y2="436" class="axis" marker-end="url(#arrow)"/><rect x="52" y="440" width="378" height="40" rx="4" class="cone"/><rect x="52" y="440" width="378" height="40" rx="4" class="rule"/><text x="66" y="465" text-anchor="start" class="label-accent">6</text><text x="82" y="457" text-anchor="start" class="label">Local circumstances, smooth Moon</text><text x="82" y="471" text-anchor="start" class="label-dim">contacts, magnitude, obscuration, P and V</text><rect x="470" y="260" width="254" height="150" rx="4" class="rule dashed"/><text x="484" y="282" text-anchor="start" class="label">Direct topocentric path</text><text x="484" y="300" text-anchor="start" class="label-dim">root-find δ(t) = rₛ ± rₘ on the</text><text x="484" y="314" text-anchor="start" class="label-dim">apparent topocentric places of</text><text x="484" y="328" text-anchor="start" class="label-dim">stage 1, with no elements formed</text><text x="484" y="350" text-anchor="start" class="label-dim">site-level work and limb tests</text><path d="M 597.0 410.0 L 597.0 460.0 L 436.0 460.0" class="accent-2 dashed" marker-end="url(#arrow)"/><text x="589" y="440" text-anchor="end" class="label-accent">cross-check</text><text x="589" y="453" text-anchor="end" class="label-dim">the two paths agree to 0.1 s</text><line x1="241" y1="480" x2="241" y2="512" class="axis" marker-end="url(#arrow)"/><rect x="52" y="516" width="672" height="40" rx="4" class="cone"/><rect x="52" y="516" width="672" height="40" rx="4" class="rule"/><text x="66" y="541" text-anchor="start" class="label-accent">7</text><text x="82" y="533" text-anchor="start" class="label">Terrain</text><text x="82" y="547" text-anchor="start" class="label-dim">SRTM GL1 or Copernicus GLO-30 orthometric height plus geoid undulation</text><line x1="241" y1="556" x2="241" y2="572" class="axis" marker-end="url(#arrow)"/><rect x="52" y="576" width="672" height="40" rx="4" class="cone"/><rect x="52" y="576" width="672" height="40" rx="4" class="rule"/><text x="66" y="601" text-anchor="start" class="label-accent">8</text><text x="82" y="593" text-anchor="start" class="label">Lunar limb</text><text x="82" y="607" text-anchor="start" class="label-dim">LOLA profile binned to 18,000 elements, then umbra polygons, true limits and beads</text><line x1="241" y1="616" x2="241" y2="632" class="axis" marker-end="url(#arrow)"/><rect x="52" y="636" width="672" height="40" rx="4" class="cone"/><rect x="52" y="636" width="672" height="40" rx="4" class="rule"/><text x="66" y="661" text-anchor="start" class="label-accent">9</text><text x="82" y="653" text-anchor="start" class="label">Products with uncertainty</text><text x="82" y="667" text-anchor="start" class="label-dim">error-budget rows summed in quadrature, limits drawn at s₀ and s₀ ± σ</text><line x1="30" y1="124" x2="30" y2="480" class="accent"/><line x1="30" y1="124" x2="39" y2="124" class="accent"/><line x1="30" y1="480" x2="39" y2="480" class="accent"/><text x="23" y="302" text-anchor="middle" class="label-accent" transform="rotate(-90 23.0 302.0)">almanac mode: stages 1 to 6</text><line x1="30" y1="516" x2="30" y2="616" class="accent-2 dashed"/><line x1="30" y1="516" x2="39" y2="516" class="accent-2 dashed"/><line x1="30" y1="616" x2="39" y2="616" class="accent-2 dashed"/><text x="23" y="566" text-anchor="middle" class="label-accent" transform="rotate(-90 23.0 566.0)">edge mode adds 7 and 8</text><text x="23" y="656" text-anchor="middle" class="label-dim" transform="rotate(-90 23.0 656.0)">both modes</text><text x="8" y="698" text-anchor="start" class="label-dim">Schematic. Stage numbers follow the pipeline design note. A dashed outline marks the path that forms no elements.</text></svg>
