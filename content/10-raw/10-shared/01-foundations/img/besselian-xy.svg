<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" class="figsvg"><title>The shadow on the fundamental plane</title><desc>The fundamental plane viewed along the shadow axis. The Earth is a circle of unit radius with its centre marked. An x axis runs east from that centre and a y axis runs north. Two concentric circles, the large penumbra of radius l1 and the small umbra of radius l2, are centred on the point (x, y) up and to the left of the Earth&#x27;s centre. A line from the Earth&#x27;s centre to that point is labelled gamma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><circle cx="300" cy="215" r="130" class="body"/><circle cx="241.5" cy="178.6" r="70.2" class="cone"/><circle cx="241.5" cy="178.6" r="70.2" class="accent dashed"/><circle cx="241.5" cy="178.6" r="13" class="cone-deep"/><circle cx="241.5" cy="178.6" r="13" class="accent-2"/><line x1="300" y1="215" x2="470" y2="215" class="axis" marker-end="url(#arrow)"/><line x1="300" y1="215" x2="300" y2="55" class="axis" marker-end="url(#arrow)"/><text x="476" y="219" text-anchor="start" class="label-em">x  (east)</text><text x="300" y="44" text-anchor="middle" class="label-em">y  (north)</text><line x1="300" y1="215" x2="241.5" y2="178.6" class="accent-2"/><circle cx="300" cy="215" r="3" class="accent-2-fill"/><circle cx="241.5" cy="178.6" r="2.5" class="accent-2-fill"/><text x="277.62" y="189.76" text-anchor="middle" class="label-em">γ</text><line x1="241.5" y1="178.6" x2="175.53" y2="202.61" class="accent" marker-end="url(#arrow)"/><text x="212.52" y="182.6" text-anchor="middle" class="label-em">l₁</text><text x="169.53" y="216.61" text-anchor="end" class="label-dim">penumbra</text><line x1="232.31" y1="169.41" x2="150" y2="110" class="rule thin"/><text x="146" y="110" text-anchor="end" class="label-em">l₂  (umbra)</text><text x="146" y="124" text-anchor="end" class="label-dim">drawn much enlarged</text><text x="241.5" y="155.6" text-anchor="middle" class="label-em">(x, y)</text><text x="308" y="232" text-anchor="start" class="label-dim">the Earth&#x27;s centre</text><text x="300" y="368" text-anchor="middle" class="label">the Earth&#x27;s disc, radius 1</text><text x="8" y="412" text-anchor="start" class="label-dim">Schematic. The umbral circle is drawn about ten times its true size; published elements give l₂ near 0.01 Earth radii against l₁ near 0.54.</text></svg>
