<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" class="figsvg"><title>An observer raised by h meets the shadow edge h cot A sooner</title><desc>A cross-section. A solid horizontal line is the ellipsoid and a dashed horizontal line above it is the terrain at height h. A straight line inclined at sixty degrees, the Sun&#x27;s altitude, is the edge of the umbra: it runs down from the upper right, crosses the terrain line at the observer, and meets the ellipsoid further to the left at the point where a sea-level map draws the limit. The horizontal gap between those two crossings, marked with a double arrow below the ellipsoid, is h cot A. Everything to the left of the edge is shaded as inside the umbra. Dotted rays parallel to the edge show the direction of the Sun. A panel lists the shift per thousand metres of elevation: 577 metres with the Sun at sixty degrees, 1000 metres at forty-five and 1732 metres at thirty.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><polygon points="40,70 397.36,70 264.57,300 40,300" class="cone-deep"/><text x="52" y="92" text-anchor="start" class="label-dim">inside the umbra</text><line x1="40" y1="300" x2="470" y2="300" class="axis"/><text x="468" y="316" text-anchor="end" class="label-dim">WGS 84 ellipsoid</text><line x1="40" y1="204" x2="470" y2="204" class="axis dashed"/><text x="468" y="196" text-anchor="end" class="label-dim">terrain at height h</text><line x1="397.36" y1="70" x2="264.57" y2="300" class="accent"/><text x="403.36" y="82" text-anchor="start" class="label-accent">edge of the umbra</text><line x1="324.57" y1="292" x2="384.57" y2="188.08" class="rule thin dotted"/><line x1="354.57" y1="292" x2="414.57" y2="188.08" class="rule thin dotted"/><line x1="384.57" y1="292" x2="444.57" y2="188.08" class="rule thin dotted"/><line x1="464.57" y1="205.4" x2="484.57" y2="170.76" class="axis" marker-end="url(#arrow)"/><text x="478.57" y="164.76" text-anchor="end" class="label-dim">to the Sun</text><path d="M 306.57 300 A 42 42 0 0 0 285.57 263.63" class="rule thin"/><text x="272.57" y="292" text-anchor="start" class="label-em">A = 60°</text><line x1="320" y1="204" x2="320" y2="300" class="accent-2 dashed"/><text x="326" y="256" text-anchor="start" class="label-em">h</text><circle cx="320" cy="204" r="4.5" class="accent-2-fill"/><text x="336" y="180" text-anchor="start" class="label">observer</text><line x1="264.57" y1="330" x2="320" y2="330" class="accent-2" marker-end="url(#arrow)"/><line x1="320" y1="330" x2="264.57" y2="330" class="accent-2" marker-end="url(#arrow)"/><text x="292.29" y="346" text-anchor="middle" class="label-em">h cot A</text><line x1="264.57" y1="300" x2="264.57" y2="334" class="rule thin"/><text x="258.57" y="362" text-anchor="end" class="label-dim">the limit drawn</text><text x="258.57" y="374" text-anchor="end" class="label-dim">at sea level</text><text x="326" y="362" text-anchor="start" class="label-dim">where the raised observer</text><text x="326" y="374" text-anchor="start" class="label-dim">actually meets the edge</text><text x="494" y="92" text-anchor="start" class="label">Shift per 1000 m of elevation,</text><text x="494" y="106" text-anchor="start" class="label">with the Sun square to the limit:</text><text x="514" y="132" text-anchor="start" class="label-dim">A = 60°</text><text x="668" y="132" text-anchor="end" class="tick">577 m</text><text x="514" y="152" text-anchor="start" class="label-dim">A = 45°</text><text x="668" y="152" text-anchor="end" class="tick">1000 m</text><text x="514" y="172" text-anchor="start" class="label-dim">A = 30°</text><text x="668" y="172" text-anchor="end" class="tick">1732 m</text><text x="494" y="208" text-anchor="start" class="label-dim">Only the component across the</text><text x="494" y="220" text-anchor="start" class="label-dim">limit counts, so the full shift is</text><text x="494" y="238" text-anchor="start" class="label-em">Δ⊥ = h cot A sin D,</text><text x="494" y="256" text-anchor="start" class="label-dim">with D the angle between the</text><text x="494" y="268" text-anchor="start" class="label-dim">Sun&#x27;s azimuth and the limit line.</text><text x="8" y="392" text-anchor="start" class="label-dim">Schematic. The height is exaggerated and the ellipsoid is drawn flat, but the drawn offset really is cot 60° of the drawn height.</text></svg>
