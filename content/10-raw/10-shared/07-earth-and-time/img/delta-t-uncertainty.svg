<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" class="figsvg"><title>The standard error of ΔT against year</title><desc>A chart with the year from minus one thousand to plus three thousand along the horizontal axis and the standard error of delta T, in seconds, on a logarithmic vertical axis running from a tenth of a second to nearly two thousand. Ten points fall in a deep V, with the trough in the telescopic era. They drop from 636 seconds at year minus one thousand through 265 at year zero, 139 at 500, 54 at 1000 and 31 at 1200 to 5 seconds at 1700, 1 second at 1800 and a tenth of a second at 1900, then climb again to 612 seconds at 2500 and 1885 seconds at 3000. The last two, and only those, come from Huber&#x27;s extrapolation and are drawn as open squares. A horizontal dashed line at 265 seconds marks the level above which the Five Millennium Canon draws a longitude gore on its maps.</desc><line x1="76" y1="288.76" x2="648" y2="288.76" class="rule thin dotted"/><text x="68" y="292.26" text-anchor="end" class="tick">0.1 s</text><line x1="76" y1="238.11" x2="648" y2="238.11" class="rule thin dotted"/><text x="68" y="241.61" text-anchor="end" class="tick">1 s</text><line x1="76" y1="187.46" x2="648" y2="187.46" class="rule thin dotted"/><text x="68" y="190.96" text-anchor="end" class="tick">10 s</text><line x1="76" y1="136.82" x2="648" y2="136.82" class="rule thin dotted"/><text x="68" y="140.32" text-anchor="end" class="tick">100 s</text><line x1="76" y1="86.17" x2="648" y2="86.17" class="rule thin dotted"/><text x="68" y="89.67" text-anchor="end" class="tick">1000 s</text><line x1="76" y1="62" x2="76" y2="300" class="rule thin"/><line x1="76" y1="300" x2="648" y2="300" class="rule thin"/><line x1="76" y1="300" x2="76" y2="305" class="rule thin"/><text x="76" y="318" text-anchor="middle" class="tick">-1000</text><line x1="219" y1="300" x2="219" y2="305" class="rule thin"/><text x="219" y="318" text-anchor="middle" class="tick">0</text><line x1="362" y1="300" x2="362" y2="305" class="rule thin"/><text x="362" y="318" text-anchor="middle" class="tick">1000</text><line x1="505" y1="300" x2="505" y2="305" class="rule thin"/><text x="505" y="318" text-anchor="middle" class="tick">2000</text><line x1="648" y1="300" x2="648" y2="305" class="rule thin"/><text x="648" y="318" text-anchor="middle" class="tick">3000</text><text x="362" y="336" text-anchor="middle" class="label-dim">year</text><text x="30" y="48" text-anchor="start" class="label-dim">standard error of ΔT</text><line x1="76" y1="115.38" x2="648" y2="115.38" class="accent dashed"/><text x="190.4" y="89.38" text-anchor="start" class="label-accent">265 s: above this the Five Millennium Canon</text><text x="190.4" y="101.38" text-anchor="start" class="label-accent">draws a longitude gore on the map</text><circle cx="76" cy="96.12" r="4.5" class="accent-2-fill"/><circle cx="219" cy="115.38" r="4.5" class="accent-2-fill"/><circle cx="290.5" cy="129.57" r="4.5" class="accent-2-fill"/><circle cx="362" cy="150.37" r="4.5" class="accent-2-fill"/><circle cx="390.6" cy="162.58" r="4.5" class="accent-2-fill"/><circle cx="462.1" cy="202.71" r="4.5" class="accent-2-fill"/><circle cx="476.4" cy="238.11" r="4.5" class="accent-2-fill"/><circle cx="490.7" cy="288.76" r="4.5" class="accent-2-fill"/><rect x="572" y="92.47" width="9" height="9" class="accent-2"/><rect x="643.5" y="67.72" width="9" height="9" class="accent-2"/><circle cx="512.15" cy="258.27" r="4.5" class="accent-2-fill"/><text x="524.15" y="262.27" text-anchor="start" class="label-dim">from the observed record</text><rect x="507.65" y="272.77" width="9" height="9" class="accent-2"/><text x="524.15" y="281.27" text-anchor="start" class="label-dim">from Huber&#x27;s extrapolation</text><text x="86" y="100.12" text-anchor="start" class="tick">636 s</text><text x="480.7" y="292.76" text-anchor="end" class="tick">0.1 s</text><text x="638" y="76.22" text-anchor="end" class="tick">1885 s</text><text x="8" y="390" text-anchor="start" class="label-dim">One second of ΔT moves the whole eclipse 465 m in longitude at the equator and 356 m at latitude 40°.</text></svg>
