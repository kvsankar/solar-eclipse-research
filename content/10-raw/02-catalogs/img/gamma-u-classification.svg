<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" class="figsvg"><title>Eclipse classification in the gamma-u plane</title><desc>A plot of the absolute value of gamma against the umbral radius u, both in Earth equatorial radii. A nearly horizontal line at gamma = 1.5433 + u divides no eclipse above from partial below. A horizontal line at gamma = 0.9972 divides partial above from central below, with a very thin wedge between 0.9972 and 0.9972 + the absolute value of u holding the non-central umbral eclipses. The central region is cut vertically at u = 0, with total to the left and annular to the right, and a narrow wedge beside u = 0 bounded by the curve u = 0.00464 times the square root of one minus gamma squared holds the hybrid eclipses. A second, smaller panel on the right repeats the non-central wedge on a stretched gamma axis running from 0.990 to 1.030.</desc><polygon points="70,162.46 235,165.76 400,162.46 400,72.52 70,79.1" class="cone"/><polygon points="70,162.46 235,165.76 400,162.46 400,165.76 70,165.76" class="cone-deep"/><line x1="70" y1="162.46" x2="235" y2="165.76" class="accent-2 dashed"/><line x1="235" y1="165.76" x2="400" y2="162.46" class="accent-2 dashed"/><polygon points="235,330 273.28,330 273.27,326.58 273.25,323.16 273.21,319.73 273.15,316.31 273.07,312.89 272.98,309.47 272.87,306.05 272.75,302.63 272.6,299.2 272.44,295.78 272.27,292.36 272.07,288.94 271.86,285.52 271.63,282.1 271.37,278.67 271.1,275.25 270.81,271.83 270.5,268.41 270.17,264.99 269.82,261.56 269.44,258.14 269.05,254.72 268.63,251.3 268.18,247.88 267.71,244.46 267.22,241.03 266.69,237.61 266.14,234.19 265.55,230.77 264.94,227.35 264.28,223.93 263.6,220.5 262.87,217.08 262.1,213.66 261.28,210.24 260.41,206.82 259.49,203.39 258.5,199.97 257.44,196.55 256.29,193.13 255.06,189.71 253.7,186.29 252.2,182.86 250.52,179.44 248.59,176.02 246.27,172.6 243.26,169.18 237.86,165.76 235,165.76" class="cone-deep"/><line x1="70" y1="79.1" x2="400" y2="72.52" class="accent dashed"/><line x1="70" y1="165.76" x2="400" y2="165.76" class="accent"/><line x1="235" y1="165.76" x2="235" y2="330" class="accent-2"/><line x1="273.77" y1="165.76" x2="273.77" y2="330" class="rule dotted"/><polyline points="273.28,330 273.27,326.58 273.25,323.16 273.21,319.73 273.15,316.31 273.07,312.89 272.98,309.47 272.87,306.05 272.75,302.63 272.6,299.2 272.44,295.78 272.27,292.36 272.07,288.94 271.86,285.52 271.63,282.1 271.37,278.67 271.1,275.25 270.81,271.83 270.5,268.41 270.17,264.99 269.82,261.56 269.44,258.14 269.05,254.72 268.63,251.3 268.18,247.88 267.71,244.46 267.22,241.03 266.69,237.61 266.14,234.19 265.55,230.77 264.94,227.35 264.28,223.93 263.6,220.5 262.87,217.08 262.1,213.66 261.28,210.24 260.41,206.82 259.49,203.39 258.5,199.97 257.44,196.55 256.29,193.13 255.06,189.71 253.7,186.29 252.2,182.86 250.52,179.44 248.59,176.02 246.27,172.6 243.26,169.18 237.86,165.76" class="accent-2 dashed"/><line x1="70" y1="50" x2="70" y2="330" class="rule"/><line x1="70" y1="330" x2="400" y2="330" class="rule"/><line x1="66" y1="330" x2="70" y2="330" class="rule"/><text x="62" y="333.5" text-anchor="end" class="tick">0.0</text><line x1="66" y1="247.65" x2="70" y2="247.65" class="rule"/><text x="62" y="251.15" text-anchor="end" class="tick">0.5</text><line x1="66" y1="165.29" x2="70" y2="165.29" class="rule"/><text x="62" y="168.79" text-anchor="end" class="tick">1.0</text><line x1="66" y1="82.94" x2="70" y2="82.94" class="rule"/><text x="62" y="86.44" text-anchor="end" class="tick">1.5</text><line x1="70" y1="330" x2="70" y2="334" class="rule"/><text x="70" y="346" text-anchor="middle" class="tick">-0.02</text><line x1="152.5" y1="330" x2="152.5" y2="334" class="rule"/><text x="152.5" y="346" text-anchor="middle" class="tick">-0.01</text><line x1="235" y1="330" x2="235" y2="334" class="rule"/><text x="235" y="346" text-anchor="middle" class="tick">0</text><line x1="317.5" y1="330" x2="317.5" y2="334" class="rule"/><text x="317.5" y="346" text-anchor="middle" class="tick">+0.01</text><line x1="400" y1="330" x2="400" y2="334" class="rule"/><text x="400" y="346" text-anchor="middle" class="tick">+0.02</text><text x="235" y="63.81" text-anchor="middle" class="label">no eclipse</text><text x="235" y="89.81" text-anchor="middle" class="label-dim">|γ| = 1.5433 + u</text><text x="235" y="119.18" text-anchor="middle" class="label">partial</text><text x="235" y="157.76" text-anchor="middle" class="label-dim">|γ| = 0.9972</text><text x="131.88" y="211.41" text-anchor="middle" class="label">total</text><text x="131.88" y="231.18" text-anchor="middle" class="label-dim">u &lt; 0</text><text x="338.12" y="211.41" text-anchor="middle" class="label">annular</text><text x="278.77" y="175.18" text-anchor="start" class="label-dim">u = 0.0047</text><line x1="253.15" y1="260.82" x2="189.62" y2="277.29" class="rule thin"/><text x="187.15" y="280.59" text-anchor="end" class="label">hybrid</text><text x="187.15" y="293.76" text-anchor="end" class="label-dim">u &lt; 0.00464√(1 − γ²)</text><text x="70" y="36" text-anchor="middle" class="label-em">|γ|</text><text x="235" y="368" text-anchor="middle" class="label">u, the umbral radius on the fundamental plane (Earth equatorial radii)</text><text x="568" y="66" text-anchor="middle" class="label">Detail: the non-central band</text><text x="568" y="80" text-anchor="middle" class="label-dim">0.9972 &lt; |γ| &lt; 0.9972 + |u|</text><polygon points="476,151.68 568,238.68 660,151.68 660,96 476,96" class="cone"/><polygon points="476,151.68 568,238.68 660,151.68 660,238.68 476,238.68" class="cone-deep"/><line x1="476" y1="238.68" x2="660" y2="238.68" class="accent"/><line x1="476" y1="151.68" x2="568" y2="238.68" class="accent-2 dashed"/><line x1="568" y1="238.68" x2="660" y2="151.68" class="accent-2 dashed"/><line x1="476" y1="96" x2="476" y2="270" class="rule"/><line x1="476" y1="270" x2="660" y2="270" class="rule"/><line x1="472" y1="238.68" x2="476" y2="238.68" class="rule"/><text x="468" y="242.18" text-anchor="end" class="tick">0.9972</text><line x1="472" y1="151.68" x2="476" y2="151.68" class="rule"/><text x="468" y="155.18" text-anchor="end" class="tick">1.0172</text><line x1="476" y1="270" x2="476" y2="274" class="rule"/><text x="476" y="286" text-anchor="middle" class="tick">-0.02</text><line x1="568" y1="270" x2="568" y2="274" class="rule"/><text x="568" y="286" text-anchor="middle" class="tick">0</text><line x1="660" y1="270" x2="660" y2="274" class="rule"/><text x="660" y="286" text-anchor="middle" class="tick">+0.02</text><text x="568" y="304" text-anchor="middle" class="label-em">u</text><text x="568" y="126.45" text-anchor="middle" class="label">partial</text><text x="515.1" y="206.93" text-anchor="middle" class="label">non-central</text><text x="515.1" y="226.5" text-anchor="middle" class="label">umbral</text><text x="568" y="256.95" text-anchor="middle" class="label">central</text><text x="8" y="392" text-anchor="start" class="label-dim">Every boundary is one of Meeus&#x27;s inequalities; nothing else is plotted. u is the umbral radius on the fundamental plane, the same quantity as l₂.</text></svg>
