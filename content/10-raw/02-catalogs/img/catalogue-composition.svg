<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" class="figsvg"><title>Composition of the Five Millennium Catalogue</title><desc>A horizontal bar chart of the 11,898 solar eclipses in the Five Millennium Catalogue by type. Partial is the longest bar at 4,200 eclipses or 35.3 per cent, annular next at 3,956 or 33.2 per cent, total next at 3,173 or 26.7 per cent, and hybrid a short bar at 569 or 4.8 per cent. Partial, annular and total are of comparable size; hybrid is smaller than any of them by a factor of about six.</desc><text x="8" y="28" text-anchor="start" class="label">Five Millennium Catalogue of Solar Eclipses, −1999 to +3000: 11,898 eclipses</text><line x1="227.24" y1="33" x2="227.24" y2="256" class="rule dotted"/><line x1="332.48" y1="33" x2="332.48" y2="256" class="rule dotted"/><line x1="437.71" y1="33" x2="437.71" y2="256" class="rule dotted"/><line x1="542.95" y1="33" x2="542.95" y2="256" class="rule dotted"/><rect x="122" y="45" width="442" height="34" class="cone"/><rect x="122" y="45" width="442" height="34" class="rule thin"/><text x="112" y="66" text-anchor="end" class="label">partial</text><text x="576" y="66" text-anchor="start" class="label">4,200</text><text x="624" y="66" text-anchor="start" class="label-dim">(35.3%)</text><rect x="122" y="100" width="416.32" height="34" class="cone"/><rect x="122" y="100" width="416.32" height="34" class="rule thin"/><text x="112" y="121" text-anchor="end" class="label">annular</text><text x="550.32" y="121" text-anchor="start" class="label">3,956</text><text x="598.32" y="121" text-anchor="start" class="label-dim">(33.2%)</text><rect x="122" y="155" width="333.92" height="34" class="cone"/><rect x="122" y="155" width="333.92" height="34" class="rule thin"/><text x="112" y="176" text-anchor="end" class="label">total</text><text x="467.92" y="176" text-anchor="start" class="label">3,173</text><text x="515.92" y="176" text-anchor="start" class="label-dim">(26.7%)</text><rect x="122" y="210" width="59.88" height="34" class="cone"/><rect x="122" y="210" width="59.88" height="34" class="rule thin"/><text x="112" y="231" text-anchor="end" class="label">hybrid</text><text x="193.88" y="231" text-anchor="start" class="label">569</text><text x="227.48" y="231" text-anchor="start" class="label-dim">(4.8%)</text><line x1="122" y1="33" x2="122" y2="256" class="rule"/><line x1="122" y1="256" x2="564" y2="256" class="rule"/><line x1="122" y1="256" x2="122" y2="260" class="rule"/><text x="122" y="273" text-anchor="middle" class="tick">0</text><line x1="227.24" y1="256" x2="227.24" y2="260" class="rule"/><text x="227.24" y="273" text-anchor="middle" class="tick">1,000</text><line x1="332.48" y1="256" x2="332.48" y2="260" class="rule"/><text x="332.48" y="273" text-anchor="middle" class="tick">2,000</text><line x1="437.71" y1="256" x2="437.71" y2="260" class="rule"/><text x="437.71" y="273" text-anchor="middle" class="tick">3,000</text><line x1="542.95" y1="256" x2="542.95" y2="260" class="rule"/><text x="542.95" y="273" text-anchor="middle" class="tick">4,000</text><text x="343" y="294" text-anchor="middle" class="label">number of eclipses</text></svg>
