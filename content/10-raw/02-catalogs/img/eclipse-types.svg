<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" class="figsvg"><title>Partial, annular, total and hybrid eclipses</title><desc>Four cross-sections side by side, each with the Moon above and the curved surface of the Earth below. In the first the shadow axis passes clear of the Earth and only the penumbra lands, giving a partial eclipse. In the second the Moon is far away, the umbral cone closes to a vertex above the surface, and the widening antumbra reaches the ground, giving an annular eclipse. In the third the Moon is close, the vertex falls below the surface, and the umbra itself reaches the ground, giving a total eclipse. In the fourth a dashed arc marks every point as far from the Moon as the vertex is. The curved surface of the Earth crosses that arc twice. The middle of the surface lies inside the arc, nearer the Moon than the vertex, so the umbra reaches it and the eclipse is total there; beyond the two crossings the surface falls outside the arc, the vertex is short of the ground, and the eclipse is annular.</desc><defs><clipPath id="etp0"><rect x="0" y="26" width="175" height="254"/></clipPath></defs><g clip-path="url(#etp0)"><polygon points="3.5,95 -22.15,230 65.15,230 39.5,95" class="cone"/><polygon points="3.5,95 21.5,189.74 39.5,95" class="cone-deep"/><polygon points="21.5,189.74 13.85,230 29.15,230" class="cone"/><line x1="21.5" y1="189.74" x2="13.85" y2="230" class="axis thin dotted"/><line x1="21.5" y1="189.74" x2="29.15" y2="230" class="axis thin dotted"/><line x1="3.5" y1="95" x2="21.5" y2="189.74" class="axis thin"/><line x1="39.5" y1="95" x2="21.5" y2="189.74" class="axis thin"/><line x1="21.5" y1="95" x2="21.5" y2="230" class="axis dashed"/><path d="M 28.34 280 A 60 60 0 0 1 146.66 280 Z" class="body"/><circle cx="21.5" cy="95" r="18" class="body"/></g><text x="87.5" y="300" text-anchor="middle" class="label">Partial</text><text x="87.5" y="315" text-anchor="middle" class="label-dim">the axis misses the Earth</text><text x="87.5" y="327" text-anchor="middle" class="label-dim">only the penumbra lands</text><defs><clipPath id="etp1"><rect x="175" y="26" width="175" height="254"/></clipPath></defs><g clip-path="url(#etp1)"><polygon points="244.5,60 202.7,280 322.3,280 280.5,60" class="cone"/><polygon points="244.5,60 262.5,154.74 280.5,60" class="cone-deep"/><polygon points="262.5,154.74 238.7,280 286.3,280" class="cone"/><line x1="262.5" y1="154.74" x2="238.7" y2="280" class="axis thin dotted"/><line x1="262.5" y1="154.74" x2="286.3" y2="280" class="axis thin dotted"/><line x1="244.5" y1="60" x2="262.5" y2="154.74" class="axis thin"/><line x1="280.5" y1="60" x2="262.5" y2="154.74" class="axis thin"/><line x1="262.5" y1="60" x2="262.5" y2="210" class="axis dashed"/><path d="M 203.34 280 A 60 60 0 0 1 321.66 280 Z" class="body"/><circle cx="262.5" cy="60" r="18" class="body"/><circle cx="262.5" cy="154.74" r="3" class="accent-2-fill"/><text x="270.5" y="158.74" text-anchor="start" class="label-dim">vertex</text></g><text x="262.5" y="300" text-anchor="middle" class="label">Annular</text><text x="262.5" y="315" text-anchor="middle" class="label-dim">vertex short of the surface</text><text x="262.5" y="327" text-anchor="middle" class="label-dim">antumbra reaches the ground</text><defs><clipPath id="etp2"><rect x="350" y="26" width="175" height="254"/></clipPath></defs><g clip-path="url(#etp2)"><polygon points="419.5,155 395.75,280 479.25,280 455.5,155" class="cone"/><polygon points="419.5,155 437.5,249.74 455.5,155" class="cone-deep"/><polygon points="437.5,249.74 431.75,280 443.25,280" class="cone"/><line x1="437.5" y1="249.74" x2="431.75" y2="280" class="axis thin dotted"/><line x1="437.5" y1="249.74" x2="443.25" y2="280" class="axis thin dotted"/><line x1="419.5" y1="155" x2="437.5" y2="249.74" class="axis thin"/><line x1="455.5" y1="155" x2="437.5" y2="249.74" class="axis thin"/><line x1="437.5" y1="155" x2="437.5" y2="210" class="axis dashed"/><path d="M 378.34 280 A 60 60 0 0 1 496.66 280 Z" class="body"/><circle cx="437.5" cy="155" r="18" class="body"/><line x1="429.95" y1="210" x2="437.5" y2="249.74" class="accent-2 thin dotted"/><line x1="445.05" y1="210" x2="437.5" y2="249.74" class="accent-2 thin dotted"/><line x1="437.5" y1="210" x2="437.5" y2="249.74" class="axis dashed"/><circle cx="437.5" cy="249.74" r="3" class="accent-2-fill"/><text x="445.5" y="253.74" text-anchor="start" class="label-dim">vertex</text></g><text x="437.5" y="300" text-anchor="middle" class="label">Total</text><text x="437.5" y="315" text-anchor="middle" class="label-dim">vertex beyond the surface</text><text x="437.5" y="327" text-anchor="middle" class="label-dim">the umbra reaches the ground</text><defs><clipPath id="etp3"><rect x="525" y="26" width="175" height="254"/></clipPath></defs><g clip-path="url(#etp3)"><polygon points="594.5,146.26 569.09,280 655.91,280 630.5,146.26" class="cone"/><polygon points="594.5,146.26 612.5,241 630.5,146.26" class="cone-deep"/><polygon points="612.5,241 605.09,280 619.91,280" class="cone"/><line x1="612.5" y1="241" x2="605.09" y2="280" class="axis thin dotted"/><line x1="612.5" y1="241" x2="619.91" y2="280" class="axis thin dotted"/><line x1="594.5" y1="146.26" x2="612.5" y2="241" class="axis thin"/><line x1="630.5" y1="146.26" x2="612.5" y2="241" class="axis thin"/><line x1="612.5" y1="146.26" x2="612.5" y2="210" class="axis dashed"/><path d="M 553.34 280 A 60 60 0 0 1 671.66 280 Z" class="body"/><circle cx="612.5" cy="146.26" r="18" class="body"/><line x1="606.61" y1="210" x2="612.5" y2="241" class="accent-2 thin dotted"/><line x1="618.39" y1="210" x2="612.5" y2="241" class="accent-2 thin dotted"/><line x1="612.5" y1="210" x2="612.5" y2="241" class="axis dashed"/><circle cx="612.5" cy="241" r="3" class="accent-2-fill"/><text x="612.5" y="256" text-anchor="middle" class="label-dim">vertex</text><path d="M 532.16 196.47 A 94.74 94.74 0 0 0 692.84 196.47" class="accent-2 thin dashed"/><circle cx="567.91" cy="229.85" r="2.2" class="accent-2-fill"/><circle cx="657.09" cy="229.85" r="2.2" class="accent-2-fill"/><text x="597.5" y="225.91" text-anchor="middle" class="label-em">T</text><text x="558.91" y="254.01" text-anchor="middle" class="label-em">A</text><text x="666.09" y="254.01" text-anchor="middle" class="label-em">A</text></g><text x="612.5" y="300" text-anchor="middle" class="label">Hybrid</text><text x="612.5" y="315" text-anchor="middle" class="label-dim">the surface crosses the</text><text x="612.5" y="327" text-anchor="middle" class="label-dim">vertex distance: total (T) inside,</text><text x="612.5" y="339" text-anchor="middle" class="label-dim">annular (A) beyond</text><line x1="175" y1="32" x2="175" y2="280" class="rule thin dotted"/><line x1="350" y1="32" x2="350" y2="280" class="rule thin dotted"/><line x1="525" y1="32" x2="525" y2="280" class="rule thin dotted"/><text x="8" y="352" text-anchor="start" class="label-dim">Schematic. The cone angle, the Moon&#x27;s size and the spread of its distance are exaggerated; the real vertex falls near the surface.</text></svg>
