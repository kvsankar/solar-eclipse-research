<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" class="figsvg"><title>Ring-plane crossings of Saturn by the Sun and the Earth, 1995 to 2025</title><desc>A horizontal time axis runs from 1993 to 2028 with ticks every five years. An upper row of circles marks the three Sun crossings in November 1995, August 2009 and May 2025. Brackets between them give the intervals, 13.72 years and 15.74 years. A lower row of diamonds marks the Earth crossings: three in 1995 and 1996, one in 2009 and one in 2025.</desc><line x1="60" y1="200" x2="720" y2="200" class="axis"/><line x1="97.71" y1="200" x2="97.71" y2="206" class="tick"/><text x="97.71" y="222" text-anchor="middle" class="label-dim">1995</text><line x1="192" y1="200" x2="192" y2="206" class="tick"/><text x="192" y="222" text-anchor="middle" class="label-dim">2000</text><line x1="286.29" y1="200" x2="286.29" y2="206" class="tick"/><text x="286.29" y="222" text-anchor="middle" class="label-dim">2005</text><line x1="380.57" y1="200" x2="380.57" y2="206" class="tick"/><text x="380.57" y="222" text-anchor="middle" class="label-dim">2010</text><line x1="474.86" y1="200" x2="474.86" y2="206" class="tick"/><text x="474.86" y="222" text-anchor="middle" class="label-dim">2015</text><line x1="569.14" y1="200" x2="569.14" y2="206" class="tick"/><text x="569.14" y="222" text-anchor="middle" class="label-dim">2020</text><line x1="663.43" y1="200" x2="663.43" y2="206" class="tick"/><text x="663.43" y="222" text-anchor="middle" class="label-dim">2025</text><text x="54" y="100" text-anchor="end" class="label">Sun</text><text x="54" y="160" text-anchor="end" class="label">Earth</text><line x1="60" y1="96" x2="720" y2="96" class="rule thin dotted"/><line x1="60" y1="156" x2="720" y2="156" class="rule thin dotted"/><circle cx="114.35" cy="96" r="6" class="accent-fill"/><text x="114.35" y="118" text-anchor="middle" class="label-dim">1995-11-19</text><circle cx="373.13" cy="96" r="6" class="accent-fill"/><text x="373.13" y="118" text-anchor="middle" class="label-dim">2009-08-10</text><circle cx="669.89" cy="96" r="6" class="accent-fill"/><text x="669.89" y="118" text-anchor="middle" class="label-dim">2025-05-06</text><polygon points="104.95,150 110.95,156 104.95,162 98.95,156" class="accent-2-fill"/><polygon points="109.18,150 115.18,156 109.18,162 103.18,156" class="accent-2-fill"/><polygon points="118.68,150 124.68,156 118.68,162 112.68,156" class="accent-2-fill"/><polygon points="374.42,150 380.42,156 374.42,162 368.42,156" class="accent-2-fill"/><polygon points="667.61,150 673.61,156 667.61,162 661.61,156" class="accent-2-fill"/><line x1="114.35" y1="74" x2="373.13" y2="74" class="accent"/><line x1="114.35" y1="68" x2="114.35" y2="80" class="accent"/><line x1="373.13" y1="68" x2="373.13" y2="80" class="accent"/><text x="243.74" y="66" text-anchor="middle" class="label-accent">13.72 years</text><line x1="373.13" y1="74" x2="669.89" y2="74" class="accent"/><line x1="373.13" y1="68" x2="373.13" y2="80" class="accent"/><line x1="669.89" y1="68" x2="669.89" y2="80" class="accent"/><text x="521.51" y="66" text-anchor="middle" class="label-accent">15.74 years</text><text x="392.12" y="30" text-anchor="middle" class="label-em">two intervals sum to 29.46 years, about one Saturnian year</text><text x="8" y="244" text-anchor="start" class="label-dim">Data figure. Circles: Sun crossings (Saturnian equinoxes). Diamonds: Earth crossings.</text></svg>
