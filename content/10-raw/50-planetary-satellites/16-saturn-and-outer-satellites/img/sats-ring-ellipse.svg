<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" class="figsvg"><title>Saturn&#x27;s globe and ring edges at a ring opening of 20 degrees</title><desc>Five concentric ellipses centred on Saturn, numbered 1 to 5, show the outer and inner edges of ring A, the outer and inner edges of ring B and the inner edge of ring C. Rings A, B and C are shaded alike. The gap between edges 2 and 3 is the Cassini Division. The flattened globe sits in the middle and hides the middle of the back arc of each ellipse, while the front arc crosses in front of it. An arrow marks half the major axis of edge 1 and a dashed line marks half its minor axis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><path d="M 90 190 A 310 106.03 0 0 1 710 190 L 672.83 190 A 272.83 93.31 0 0 0 127.17 190 Z" class="cone"/><path d="M 133.43 190 A 266.57 91.17 0 0 1 666.57 190 L 606.15 190 A 206.15 70.51 0 0 0 193.85 190 Z" class="cone"/><path d="M 193.85 190 A 206.15 70.51 0 0 1 606.15 190 L 570.07 190 A 170.07 58.17 0 0 0 229.93 190 Z" class="cone"/><path d="M 90 190 A 310 106.03 0 0 1 710 190" class="rule thin"/><path d="M 127.17 190 A 272.83 93.31 0 0 1 672.83 190" class="rule thin"/><path d="M 133.43 190 A 266.57 91.17 0 0 1 666.57 190" class="rule thin"/><path d="M 193.85 190 A 206.15 70.51 0 0 1 606.15 190" class="rule thin"/><path d="M 229.93 190 A 170.07 58.17 0 0 1 570.07 190" class="rule thin"/><ellipse cx="400" cy="190" rx="137.26" ry="125.46" class="body"/><path d="M 90 190 A 310 106.03 0 0 0 710 190 L 672.83 190 A 272.83 93.31 0 0 1 127.17 190 Z" class="cone"/><path d="M 133.43 190 A 266.57 91.17 0 0 0 666.57 190 L 606.15 190 A 206.15 70.51 0 0 1 193.85 190 Z" class="cone"/><path d="M 193.85 190 A 206.15 70.51 0 0 0 606.15 190 L 570.07 190 A 170.07 58.17 0 0 1 229.93 190 Z" class="cone"/><path d="M 90 190 A 310 106.03 0 0 0 710 190" class="rule thin"/><path d="M 127.17 190 A 272.83 93.31 0 0 0 672.83 190" class="rule thin"/><path d="M 133.43 190 A 266.57 91.17 0 0 0 666.57 190" class="rule thin"/><path d="M 193.85 190 A 206.15 70.51 0 0 0 606.15 190" class="rule thin"/><path d="M 229.93 190 A 170.07 58.17 0 0 0 570.07 190" class="rule thin"/><line x1="400" y1="190" x2="710" y2="190" class="accent" marker-end="url(#arrow)"/><text x="592.2" y="183" text-anchor="middle" class="label-accent">a/2</text><line x1="400" y1="190" x2="400" y2="83.97" class="axis dashed"/><text x="408" y="97.97" text-anchor="start" class="label-em">b/2 = (a/2) sin|B|</text><circle cx="209.14" cy="273.55" r="2.5" class="accent-fill"/><line x1="209.14" y1="273.55" x2="30" y2="326" class="rule thin"/><text x="34" y="330" text-anchor="start" class="label">1  outer edge of ring A, 1.0000 a</text><circle cx="173.81" cy="242.18" r="2.5" class="accent-fill"/><line x1="173.81" y1="242.18" x2="30" y2="346" class="rule thin"/><text x="34" y="350" text-anchor="start" class="label">2  inner edge of ring A, 0.8801 a</text><circle cx="146.48" cy="218.17" r="2.5" class="accent-fill"/><line x1="146.48" y1="218.17" x2="30" y2="366" class="rule thin"/><text x="34" y="370" text-anchor="start" class="label">3  outer edge of ring B, 0.8599 a</text><circle cx="196.98" cy="202.24" r="2.5" class="accent-fill"/><line x1="196.98" y1="202.24" x2="30" y2="386" class="rule thin"/><text x="34" y="390" text-anchor="start" class="label">4  inner edge of ring B, 0.6650 a</text><circle cx="230.17" cy="193.04" r="2.5" class="accent-fill"/><line x1="230.17" y1="193.04" x2="30" y2="406" class="rule thin"/><text x="34" y="410" text-anchor="start" class="label">5  inner edge of ring C, 0.5486 a</text><text x="750" y="330" text-anchor="end" class="label-dim">globe to scale with the rings:</text><text x="750" y="346" text-anchor="end" class="label-dim">equatorial radius 60,268 km</text><text x="750" y="362" text-anchor="end" class="label-dim">polar radius 54,364 km</text><text x="8" y="446" text-anchor="start" class="label-dim">Data figure. Edges at Meeus&#x27;s fractions of a = 375.35″/Δ, with B = 20° and P = 0.</text><text x="8" y="462" text-anchor="start" class="label-dim">Shading marks the ring bands only. It does not show optical depth.</text></svg>
