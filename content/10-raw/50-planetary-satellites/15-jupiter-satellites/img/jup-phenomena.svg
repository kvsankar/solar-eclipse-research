<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" class="figsvg"><title>Eclipse, occultation, transit and shadow transit of a Galilean satellite</title><desc>A view from above Jupiter&#x27;s north pole. Sunlight arrives from the left. A shaded band, Jupiter&#x27;s shadow, extends to the right of the planet. A circle around Jupiter is a satellite&#x27;s orbit, traversed counterclockwise. An arrow from Jupiter points down and to the left towards the Earth, at an angle to the sunlight. Two dashed lines tangent to Jupiter and parallel to the Earth direction mark the corridor that the Earth sees as Jupiter&#x27;s disc. Four satellite positions are labelled: shadow transit on the Sun side, eclipse inside the shadow band, occultation inside the dashed corridor behind Jupiter, and transit inside the dashed corridor in front of Jupiter. The eclipse and occultation positions are separated by the angle between the Sun and Earth directions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><polygon points="420,279 755,295.75 755,174.25 420,191" class="cone"/><polygon points="420,279 755,272.3 755,197.7 420,191" class="cone-deep"/><line x1="28" y1="205" x2="150" y2="205" class="rule thin" marker-end="url(#arrow)"/><line x1="28" y1="235" x2="150" y2="235" class="rule thin" marker-end="url(#arrow)"/><line x1="28" y1="265" x2="150" y2="265" class="rule thin" marker-end="url(#arrow)"/><line x1="28" y1="295" x2="150" y2="295" class="rule thin" marker-end="url(#arrow)"/><line x1="28" y1="325" x2="150" y2="325" class="rule thin" marker-end="url(#arrow)"/><text x="30" y="193" text-anchor="start" class="label-dim">sunlight</text><line x1="550.4" y1="89.98" x2="239.12" y2="307.94" class="rule dashed"/><line x1="600.88" y1="162.06" x2="289.6" y2="380.02" class="rule dashed"/><line x1="380.68" y1="262.53" x2="227.5" y2="369.79" class="accent" marker-end="url(#arrow)"/><text x="237.5" y="385.79" text-anchor="start" class="label-accent">to the Earth</text><circle cx="420" cy="235" r="150" class="rule"/><circle cx="420" cy="235" r="44" class="body"/><text x="420" y="240" text-anchor="middle" class="label">Jupiter</text><path d="M 393.95 87.28 A 150 150 0 0 0 349.58 102.56" class="accent-2" marker-end="url(#arrow)"/><text x="358.56" y="82.94" text-anchor="end" class="label-dim">orbital motion</text><circle cx="270" cy="235" r="7" class="accent-2-fill"/><line x1="270" y1="235" x2="210" y2="136" class="rule thin"/><text x="210" y="140" text-anchor="end" class="label-em">shadow transit</text><text x="210" y="154" text-anchor="end" class="label-dim">its shadow falls on the disc</text><circle cx="570" cy="235" r="7" class="accent-2-fill"/><line x1="570" y1="235" x2="610" y2="326" class="rule thin"/><text x="610" y="330" text-anchor="start" class="label-em">eclipse</text><text x="610" y="344" text-anchor="start" class="label-dim">satellite inside the shadow</text><circle cx="542.87" cy="148.96" r="7" class="accent-2-fill"/><line x1="542.87" y1="148.96" x2="627.87" y2="84.96" class="rule thin"/><text x="627.87" y="88.96" text-anchor="start" class="label-em">occultation</text><text x="627.87" y="102.96" text-anchor="start" class="label-dim">satellite behind the disc</text><circle cx="297.13" cy="321.04" r="7" class="accent-2-fill"/><line x1="297.13" y1="321.04" x2="167.13" y2="357.04" class="rule thin"/><text x="167.13" y="361.04" text-anchor="end" class="label-em">transit</text><text x="167.13" y="375.04" text-anchor="end" class="label-dim">satellite in front of the disc</text><line x1="271.4" y1="228" x2="378" y2="232" class="rule thin"/><line x1="271.4" y1="242" x2="378" y2="238" class="rule thin"/><path d="M 482 235 A 62 62 0 0 0 470.79 199.44" class="accent thin"/><text x="488.67" y="191.35" text-anchor="start" class="label-accent">phase angle</text><text x="754" y="151" text-anchor="end" class="label-dim">Jupiter&#x27;s shadow: umbra darker,</text><text x="754" y="165" text-anchor="end" class="label-dim">penumbra lighter</text><text x="8" y="448" text-anchor="start" class="label-dim">Schematic, viewed from above Jupiter&#x27;s north pole. Not to scale. The phase angle is</text><text x="8" y="462" text-anchor="start" class="label-dim">drawn as 35 degrees; at Jupiter it never exceeds about 12 degrees.</text></svg>
