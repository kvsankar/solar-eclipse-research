<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" class="figsvg"><title>The observer reduced to the fundamental plane</title><desc>Two panels. The left panel is a cross-section through the Earth. A vertical line through the Earth&#x27;s centre is the fundamental plane, perpendicular to the shadow axis, which runs horizontally toward the Sun. An observer sits on the surface on the sunward side, at geodetic latitude phi measured from the equator, and a horizontal segment from the observer to the plane is labelled zeta, the height above the plane. The right panel shows that plane face-on, with axes xi to the east and eta to the north from the Earth&#x27;s centre. The observer&#x27;s projection sits below and left of the centre and the shadow axis above and right of it. A horizontal segment labelled u and a vertical segment labelled v join the two, and the straight line between them is m. Four circles are centred on the shadow axis: the penumbral and umbral radii as tabulated on the plane, dotted, and the same two radii shrunk to the observer&#x27;s own plane, dashed and solid.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><text x="168" y="34" text-anchor="middle" class="label-dim">a cross-section through the observer</text><text x="556" y="34" text-anchor="middle" class="label-dim">the plane itself, seen from the Sun</text><circle cx="168" cy="214" r="104" class="body"/><line x1="168" y1="214" x2="32" y2="214" class="axis dashed" marker-end="url(#arrow)"/><text x="34" y="206" text-anchor="start" class="label-dim">to the Sun</text><line x1="168" y1="86" x2="168" y2="352" class="accent"/><text x="168" y="76" text-anchor="middle" class="label-accent">fundamental plane</text><line x1="57.12" y1="173.64" x2="278.88" y2="254.36" class="axis dotted"/><text x="282.88" y="266.36" text-anchor="start" class="label-dim">equator</text><line x1="168" y1="214" x2="101.15" y2="134.33" class="axis thin"/><path d="M 136.05 202.37 A 34 34 0 0 1 146.15 187.95" class="rule thin"/><text x="127.04" y="189.32" text-anchor="middle" class="label-em">φ</text><circle cx="101.15" cy="134.33" r="3.4" class="accent-2-fill"/><text x="93.15" y="128.33" text-anchor="end" class="label">observer</text><line x1="101.15" y1="134.33" x2="168" y2="134.33" class="accent-2"/><text x="134.58" y="126.33" text-anchor="middle" class="label-em">ζ</text><text x="126" y="100" text-anchor="middle" class="label-dim">height above</text><text x="126" y="112" text-anchor="middle" class="label-dim">the plane</text><line x1="168" y1="214" x2="168" y2="134.33" class="accent-2"/><text x="175" y="178.17" text-anchor="start" class="label-em">η</text><text x="175" y="330" text-anchor="start" class="label-dim">ξ points out</text><text x="175" y="342" text-anchor="start" class="label-dim">of the page</text><text x="84" y="296" text-anchor="start" class="label">Earth</text><circle cx="576" cy="172" r="128" class="accent dotted thin"/><circle cx="576" cy="172" r="112" class="accent dashed"/><circle cx="576" cy="172" r="26" class="cone-deep"/><circle cx="576" cy="172" r="32" class="accent dotted thin"/><circle cx="576" cy="172" r="26" class="accent"/><line x1="448" y1="206" x2="706" y2="206" class="axis" marker-end="url(#arrow)"/><text x="712" y="210" text-anchor="start" class="label-em">ξ</text><line x1="556" y1="246" x2="556" y2="78" class="axis" marker-end="url(#arrow)"/><text x="561" y="72" text-anchor="start" class="label-em">η</text><circle cx="556" cy="206" r="2.6" class="accent-fill"/><text x="549" y="221" text-anchor="end" class="label-dim">centre</text><line x1="496" y1="236" x2="576" y2="236" class="axis dashed"/><line x1="576" y1="236" x2="576" y2="172" class="axis dashed"/><text x="536" y="256" text-anchor="middle" class="label">u = x − ξ</text><text x="588" y="216" text-anchor="start" class="label">v = y − η</text><line x1="496" y1="236" x2="576" y2="172" class="accent-2"/><text x="527.88" y="197.85" text-anchor="middle" class="label-em">m</text><circle cx="496" cy="236" r="3.4" class="accent-2-fill"/><text x="488" y="240" text-anchor="end" class="label-em">(ξ, η)</text><circle cx="576" cy="172" r="3.4" class="accent-fill"/><text x="584" y="166" text-anchor="start" class="label">(x, y) the shadow axis</text><line x1="630" y1="55.95" x2="636" y2="49.95" class="rule thin"/><text x="638" y="49.95" text-anchor="start" class="label-accent">L₁</text><line x1="588" y1="60.64" x2="594" y2="54.64" class="rule thin"/><text x="596" y="54.64" text-anchor="start" class="label-accent">L₁′</text><line x1="558" y1="153" x2="536" y2="140" class="rule thin"/><text x="532" y="143" text-anchor="end" class="label-accent">L₂′</text><text x="432" y="344" text-anchor="start" class="label-dim">dotted: L₁ and L₂, the radii tabulated on the plane</text><text x="432" y="360" text-anchor="start" class="label">L₁′ = L₁ − ζ tan f₁      L₂′ = L₂ − ζ tan f₂</text><text x="432" y="376" text-anchor="start" class="label-dim">the same radii shrunk to the observer&#x27;s own plane, ζ away</text><text x="8" y="412" text-anchor="start" class="label-dim">Schematic. The coordinates drawn are chosen for legibility, not computed for any eclipse.</text></svg>
