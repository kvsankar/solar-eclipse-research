<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" role="img" class="figsvg"><title>Obscuration against magnitude for equal apparent discs</title><desc>A square plot with magnitude from zero to one along the horizontal axis and obscuration from zero to one up the vertical axis. A dashed straight line runs corner to corner where obscuration would equal magnitude. The computed curve starts at the same origin, stays well below that line throughout, rising slowly at first and steeply near the right, and meets it again only at the top right corner where the discs coincide. A marked point on the curve shows that a magnitude of 0.50 corresponds to an obscuration of 0.391.</desc><line x1="80" y1="380" x2="420" y2="380" class="rule"/><line x1="80" y1="380" x2="80" y2="40" class="rule"/><line x1="80" y1="380" x2="80" y2="385" class="rule thin"/><text x="80" y="398" text-anchor="middle" class="tick">0.0</text><line x1="80" y1="380" x2="75" y2="380" class="rule thin"/><text x="71" y="384" text-anchor="end" class="tick">0.0</text><line x1="148" y1="380" x2="148" y2="385" class="rule thin"/><text x="148" y="398" text-anchor="middle" class="tick">0.2</text><line x1="80" y1="312" x2="75" y2="312" class="rule thin"/><text x="71" y="316" text-anchor="end" class="tick">0.2</text><line x1="80" y1="312" x2="420" y2="312" class="rule thin dotted"/><line x1="216" y1="380" x2="216" y2="385" class="rule thin"/><text x="216" y="398" text-anchor="middle" class="tick">0.4</text><line x1="80" y1="244" x2="75" y2="244" class="rule thin"/><text x="71" y="248" text-anchor="end" class="tick">0.4</text><line x1="80" y1="244" x2="420" y2="244" class="rule thin dotted"/><line x1="284" y1="380" x2="284" y2="385" class="rule thin"/><text x="284" y="398" text-anchor="middle" class="tick">0.6</text><line x1="80" y1="176" x2="75" y2="176" class="rule thin"/><text x="71" y="180" text-anchor="end" class="tick">0.6</text><line x1="80" y1="176" x2="420" y2="176" class="rule thin dotted"/><line x1="3