<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 322" role="img" class="figsvg"><title>The four contacts as tangencies of the solar and lunar discs</title><desc>Four panels in a row, each showing the Sun as a light disc and the Moon as a slightly larger grey disc, with a dotted line through both marking the Moon&#x27;s path relative to the Sun and an arrow showing it moving to the left, eastward. In the first panel the two discs touch from outside on the right of the Sun: first contact, the beginning of the partial phase. In the second the lunar disc has just swallowed the solar one and touches it from inside: second contact, the beginning of totality. In the third the discs touch from inside on the opposite side: third contact, the end of totality. In the fourth they touch from outside on the left: fourth contact, the end of the partial phase. On the fourth panel a line runs from the Sun&#x27;s centre up to its north point and another to the point of tangency, with an arc between them labelled P, the position angle, opening counter-clockwise from north through about ninety degrees.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><text x="350" y="34" text-anchor="middle" class="label-dim">the two discs as the observer sees them: north up, east to the left</text><line x1="173.42" y1="158.35" x2="18.27" y2="174.66" class="axis dotted" marker-end="url(#arrow)"/><circle cx="96" cy="168" r="22" class="body"/><circle cx="143.56" cy="161.49" r="26" class="cone-deep"/><circle cx="143.56" cy="161.49" r="26" class="rule"/><circle cx="117.8" cy="165.02" r="3.2" class="accent-fill"/><text x="96" y="238" text-anchor="middle" class="label">C1</text><text x="96" y="254" text-anchor="middle" class="label-dim">exterior tangency</text><text x="96" y="266" text-anchor="middle" class="label-dim">the partial phase begins</text><line x1="345.42" y1="158.35" x2="190.27" y2="174.66" class="axis dotted" marker-end="url(#arrow)"/><circle cx="268" cy="168" r="22" class="body"/><circle cx="271.53" cy="166.12" r="26" class="cone-deep"/><circle cx="271.53" cy="166.12" r="26" class="rule"/><circle cx="248.58" cy="178.34" r="3.2" class="accent-fill"/><text x="268" y="238" text-anchor="middle" class="label">C2</text><text x="268" y="254" text-anchor="middle" class="label-dim">interior tangency</text><text x="268" y="266" text-anchor="middle" class="label-dim">totality begins</text><line x1="517.42" y1="158.35" x2="362.27" y2="174.66" class="axis dotted" marker-end="url(#arrow)"/><circle cx="440" cy="168" r="22" class="body"/><circle cx="436.16" cy="166.9" r="26" class="cone-deep"/><circle cx="436.16" cy="166.9" r="26" class="rule"/><circle cx="461.15" cy="174.07" r="3.2" class="accent-fill"/><text x="440" y="238" text-anchor="middle" class="label">C3</text><text x="440" y="254" text-anchor="middle" class="label-dim">interior tangency</text><text x="440" y="266" text-anchor="middle" class="label-dim">totality ends</text><line x1="689.42" y1="158.35" x2="534.27" y2="174.66" class="axis dotted" marker-end="url(#arrow)"/><circle cx="612" cy="168" r="22" class="body"/><circle cx="564.13" cy="171.52" r="26" class="cone-deep"/><circle cx="564.13" cy="171.52" r="26" class="rule"/><circle cx="590.06" cy="169.61" r="3.2" class="accent-fill"/><text x="612" y="238" text-anchor="middle" class="label">C4</text><text x="612" y="254" text-anchor="middle" class="label-dim">exterior tangency</text><text x="612" y="266" text-anchor="middle" class="label-dim">the partial phase ends</text><line x1="612" y1="168" x2="612" y2="130" class="axis"/><text x="612" y="124" text-anchor="middle" class="label-dim">N</text><line x1="612" y1="168" x2="590.06" y2="169.61" class="accent"/><path d="M 612 134 A 34 34 0 0 0 578.09 170.5" class="accent thin"/><text x="579.03" y="141.37" text-anchor="middle" class="label-accent">P</text><text x="612" y="288" text-anchor="middle" class="label-dim">P is measured eastward from the</text><text x="612" y="300" text-anchor="middle" class="label-dim">north point of the solar limb</text><text x="8" y="108" text-anchor="start" class="label-dim">the Moon&#x27;s path</text><text x="8" y="120" text-anchor="start" class="label-dim">relative to the Sun</text><line x1="66" y1="124" x2="40" y2="171" class="rule thin"/><text x="8" y="314" text-anchor="start" class="label-dim">Schematic. At the interior contacts the two limbs are drawn four pixels apart.</text></svg>
