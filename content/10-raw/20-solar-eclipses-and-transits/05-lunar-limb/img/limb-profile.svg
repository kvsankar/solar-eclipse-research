<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" class="figsvg"><title>The true lunar limb against the mean limb</title><desc>A circle stands for the mean lunar limb. A closed wiggly curve drawn around it is the true limb, departing inward and outward by up to about two and a half arcseconds, with the departure exaggerated about fifty-seven times. Position angle is marked at zero, ninety, one hundred and eighty and two hundred and seventy degrees, measured from the Moon&#x27;s north pole through east. Near position angle sixty-six degrees the true limb bulges outside the circle at a mountain peak, and near one hundred and fourteen degrees it dips inside the circle at a valley. The peak region and the valley region are shaded and labelled: the peak hides the Sun early, the valley still lets sunlight through after the nominal second contact.</desc><polygon points="346.2,147.06 347.4,147.66 348.74,148.18 350.21,148.63 351.81,149.03 353.52,149.39 355.34,149.7 357.24,150 359.22,150.29 361.23,150.58 363.25,150.91 365.25,151.28 367.17,151.72 368.97,152.25 370.59,152.9 371.99,153.67 373.12,154.6 373.93,155.68 374.41,156.92 374.54,158.32 374.33,159.85 373.81,161.5 373,163.25 371.97,165.06 370.78,166.91 369.47,168.77 368.12,170.6 366.77,172.4 365.47,174.15 364.25,175.84 363.12,177.47 362.09,179.03 361.54,179.21 361.18,178.12 360.81,177.03 360.43,175.94 360.04,174.85 359.64,173.77 359.23,172.7 358.82,171.62 358.39,170.55 357.95,169.49 357.51,168.42 357.05,167.37 356.59,166.31 356.11,165.26 355.63,164.21 355.14,163.17 354.64,162.14 354.13,161.1 353.61,160.07 353.09,159.05 352.55,158.03 352,157.02 351.45,156.01 350.89,155 350.32,154 349.74,153 349.15,152.01 348.55,151.03 347.94,150.05 347.33,149.08 346.7,148.11 346.07,147.14" class="cone-deep"/><polygon points="365.12,246.27 364.63,247.34 364.14,248.41 363.65,249.47 363.18,250.53 362.73,251.6 362.3,252.66 361.88,253.73 361.44,254.79 360.97,255.84 360.45,256.86 359.84,257.86 359.11,258.82 358.25,259.72 357