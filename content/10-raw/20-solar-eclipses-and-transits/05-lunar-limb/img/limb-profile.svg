"220" x2="396" y2="220" class="rule thin dotted"/><line x1="236" y1="324" x2="236" y2="380" class="rule thin dotted"/><line x1="132" y1="220" x2="76" y2="220" class="rule thin dotted"/><text x="236" y="48" text-anchor="middle" class="label-dim">PA 0°, lunar north</text><text x="236" y="402" text-anchor="middle" class="label-dim">PA 180°</text><text x="64" y="224" text-anchor="end" class="label-dim">PA 270°</text><text x="408" y="214" text-anchor="start" class="label-dim">PA 90°, east</text><text x="408" y="228" text-anchor="start" class="label-dim">nominal contact point</text><line x1="142.66" y1="313.34" x2="98.66" y2="347.34" class="rule thin"/><text x="34.66" y="359.34" text-anchor="start" class="label-dim">mean limb, and the Sun&#x27;s</text><text x="34.66" y="371.34" text-anchor="start" class="label-dim">limb at nominal C2</text><line x1="374.54" y1="158.32" x2="430" y2="122" class="accent thin"/><text x="452" y="110" text-anchor="start" class="label-accent">Peak at PA 66°</text><text x="452" y="126" text-anchor="start" class="label-dim">The Moon already covers the Sun</text><text x="452" y="138" text-anchor="start" class="label-dim">here, so the light at this angle</text><text x="452" y="150" text-anchor="start" class="label-dim">is cut off before nominal C2.</text><line x1="340.65" y1="266.59" x2="430" y2="276" class="accent-2 thin"/><text x="452" y="264" text-anchor="start" class="label">Valley at PA 114°</text><text x="452" y="280" text-anchor="start" class="label-dim">Sunlight still reaches the observer</text><text x="452" y="292" text-anchor="start" class="label-dim">through this valley after nominal</text><text x="452" y="304" text-anchor="start" class="label-dim">C2, so second contact comes late.</text><text x="452" y="62" text-anchor="start" class="label-dim">Position angle runs from the Moon&#x27;s</text><text x="452" y="74" text-anchor="start" class="label-dim">north pole through east.</text><text x="8" y="412" text-anchor="start" class="label-dim">Schematic. The relief is exaggerated about 57 times, and the profile is invented rather than real LOLA data.</text></svg>
