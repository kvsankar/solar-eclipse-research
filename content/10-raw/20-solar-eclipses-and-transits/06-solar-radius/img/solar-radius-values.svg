<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" class="figsvg"><title>Solar radius values in arcseconds at 1 au, with uncertainties</title><desc>A dot chart on a horizontal axis running from 959.1 to 960.2 arcseconds. Two standards are drawn as open squares: Auwers 1891 at 959.63 with an error bar of plus or minus 0.05, and the IAU 2015 nominal radius at 959.22 with no error bar. Six eclipse determinations are drawn below them as filled circles: Kubo&#x27;s range of 959.74 to 959.88 as a bar, Adassuriya 959.89 plus or minus 0.18, Quaglia 959.95 plus or minus 0.05, Jubier 959.98, Lamy 959.99 plus or minus 0.06 and Guhl 960.01. A dashed vertical line at 959.63 marks the standard still in use, and a shaded band from 959.95 to 960.01 shows that the modern eclipse values cluster about a third of an arcsecond above it.</desc><rect x="564.53" y="66" width="22.11" height="270" class="cone"/><line x1="446.63" y1="66" x2="446.63" y2="336" class="accent dashed"/><line x1="244" y1="336" x2="664" y2="336" class="rule thin"/><line x1="288.21" y1="336" x2="288.21" y2="341" class="rule thin"/><text x="288.21" y="354" text-anchor="middle" class="tick">959.2</text><line x1="361.89" y1="336" x2="361.89" y2="341" class="rule thin"/><text x="361.89" y="354" text-anchor="middle" class="tick">959.4</text><line x1="435.58" y1="336" x2="435.58" y2="341" class="rule thin"/><text x="435.58" y="354" text-anchor="middle" class="tick">959.6</text><line x1="509.26" y1="336" x2="509.26" y2="341" class="rule thin"/><text x="509.26" y="354" text-anchor="middle" class="tick">959.8</text><line x1="582.95" y1="336" x2="582.95" y2="341" class="rule thin"/><text x="582.95" y="354" text-anchor="middle" class="tick">960.0</text><line x1="656.63" y1="336" x2="656.63" y2="341" class="rule thin"/><text x="656.63" y="354" text-anchor="middle" class="tick">960.2</text><text x="454" y="372" text-anchor="middle" class="label-dim">solar angular semidiameter at 1 au, arcseconds</text><text x="8" y="74" text-anchor="start" class="label">Standards in use, drawn as open squares</text><text x="8" y="160" text-anchor="start" class="label">Eclipse determinations, drawn as filled circles</text><text x="8" y="100" text-anchor="start" class="label">Auwers 1891</text><text x="236" y="100" text-anchor="end" class="tick">959.63 ± 0.05</text><line x1="428.21" y1="96" x2="465.05" y2="96" class="accent"/><line x1="428.21" y1="91" x2="428.21" y2="101" class="accent"/><line x1="465.05" y1="91" x2="465.05" y2="101" class="accent"/><rect x="442.13" y="91.5" width="9" height="9" class="accent"/><text x="8" y="126" text-anchor="start" class="label">IAU 2015 nominal</text><text x="236" y="126" text-anchor="end" class="tick">959.22</text><rect x="291.08" y="117.5" width="9" height="9" class="accent"/><text x="8" y="186" text-anchor="start" class="label">Kubo 1993</text><text x="236" y="186" text-anchor="end" class="tick">959.74 to 959.88</text><line x1="487.16" y1="182" x2="538.74" y2="182" class="accent-2"/><line x1="487.16" y1="177" x2="487.16" y2="187" class="accent-2"/><line x1="538.74" y1="177" x2="538.74" y2="187" class="accent-2"/><text x="8" y="212" text-anchor="start" class="label">Adassuriya 2011</text><text x="236" y="212" text-anchor="end" class="tick">959.89 ± 0.18</text><line x1="476.11" y1="208" x2="608.74" y2="208" class="accent-2"/><line x1="476.11" y1="203" x2="476.11" y2="213" class="accent-2"/><line x1="608.74" y1="203" x2="608.74" y2="213" class="accent-2"/><circle cx="542.42" cy="208" r="4.5" class="accent-2-fill"/><text x="8" y="238" text-anchor="start" class="label">Quaglia 2021</text><text x="236" y="238" text-anchor="end" class="tick">959.95 ± 0.05</text><line x1="546.11" y1="234" x2="582.95" y2="234" class="accent-2"/><line x1="546.11" y1="229" x2="546.11" y2="239" class="accent-2"/><line x1="582.95" y1="229" x2="582.95" y2="239" class="accent-2"/><circle cx="564.53" cy="234" r="4.5" class="accent-2-fill"/><text x="8" y="264" text-anchor="start" class="label">Jubier 2021</text><text x="236" y="264" text-anchor="end" class="tick">959.98</text><circle cx="575.58" cy="260" r="4.5" class="accent-2-fill"/><text x="8" y="290" text-anchor="start" class="label">Lamy 2015</text><text x="236" y="290" text-anchor="end" class="tick">959.99 ± 0.06</text><line x1="557.16" y1="286" x2="601.37" y2="286" class="accent-2"/><line x1="557.16" y1="281" x2="557.16" y2="291" class="accent-2"/><line x1="601.37" y1="281" x2="601.37" y2="291" class="accent-2"/><circle cx="579.26" cy="286" r="4.5" class="accent-2-fill"/><text x="8" y="316" text-anchor="start" class="label">Guhl 2023</text><text x="236" y="316" text-anchor="end" class="tick">960.01</text><circle cx="586.63" cy="312" r="4.5" class="accent-2-fill"/><text x="440.63" y="40" text-anchor="end" class="label-accent">959.63″, the standard</text><text x="440.63" y="52" text-anchor="end" class="label-accent">still in use</text><text x="575.58" y="40" text-anchor="middle" class="label">the eclipse values</text><text x="575.58" y="52" text-anchor="middle" class="label">cluster here</text><text x="8" y="390" text-anchor="start" class="label-dim">The eclipse values measure the last photospheric light, about 0.32 arcseconds beyond Auwers&#x27; 19th-century limb.</text></svg>
