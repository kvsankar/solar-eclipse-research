<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" class="figsvg"><title>The four contacts of a planetary transit</title><desc>A large circle is the solar disc with north at the top and east on the left. A dashed horizontal line above the centre is the planet&#x27;s path, crossed from left to right. Four small circles sit on the path. The two outer ones, labelled I and IV, touch the solar limb from outside. The two inner ones, labelled II and III, touch it from inside. A filled circle marks the planet at greatest transit, directly above the solar centre, and a short vertical segment labelled b joins it to the centre. A line from the centre to contact II, and an arc from the north direction to that line, show the position angle P. A panel on the right states the contact condition.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><circle cx="270" cy="250" r="170" class="cone"/><circle cx="270" cy="250" r="170" class="rule"/><circle cx="270" cy="250" r="2.5" class="accent-2-fill"/><line x1="270" y1="250" x2="270" y2="46" class="rule thin dashed" marker-end="url(#arrow)"/><text x="270" y="40" text-anchor="middle" class="label">N</text><line x1="110" y1="380" x2="74" y2="380" class="rule thin" marker-end="url(#arrow)"/><text x="68" y="384" text-anchor="end" class="label">E</text><line x1="58.35" y1="158" x2="481.65" y2="158" class="axis dashed" marker-end="url(#arrow)"/><text x="481.65" y="176" text-anchor="end" class="label-dim">path</text><circle cx="108.35" cy="158" r="16" class="body"/><text x="108.35" y="134" text-anchor="middle" class="label-em">I</text><circle cx="146.5" cy="158" r="16" class="body"/><text x="146.5" y="134" text-anchor="middle" class="label-em">II</text><circle cx="393.5" cy="158" r="16" class="body"/><text x="393.5" y="134" text-anchor="middle" class="label-em">III</text><circle cx="431.65" cy="158" r="16" class="body"/><text x="431.65" y="134" text-anchor="middle" class="label-em">IV</text><circle cx="270" cy="158" r="16" class="accent-fill"/><line x1="270" y1="250" x2="270" y2="174" class="accent"/><text x="278" y="216" text-anchor="start" class="label-accent">b</text><text x="294" y="188" text-anchor="start" class="label-dim">greatest transit</text><line x1="270" y1="250" x2="146.5" y2="158" class="accent-2 thin"/><polyline points="270,206 267.95,206.05 265.91,206.19 263.88,206.43 261.86,206.76 259.86,207.19 257.88,207.7 255.92,208.31 254,209.01 252.11,209.8 250.26,210.68 248.45,211.64 246.69,212.68 244.98,213.81 243.32,215.01 241.73,216.29 240.19,217.64 238.71,219.06 237.31,220.55 235.98,222.1 234.71,223.71" class="accent-2"/><text x="256" y="228" text-anchor="middle" class="label-em">P</text><line x1="108.35" y1="112" x2="146.5" y2="112" class="rule thin"/><text x="127.42" y="106" text-anchor="middle" class="label-dim">ingress</text><line x1="393.5" y1="112" x2="431.65" y2="112" class="rule thin"/><text x="412.58" y="106" text-anchor="middle" class="label-dim">egress</text><text x="520" y="104" text-anchor="start" class="label-em">Contact condition</text><text x="520" y="128" text-anchor="start" class="label">separation of centres = L</text><text x="520" y="150" text-anchor="start" class="label">I and IV:  L = s☉ + s_p</text><text x="520" y="170" text-anchor="start" class="label">II and III:  L = s☉ − s_p</text><text x="520" y="198" text-anchor="start" class="label-dim">b: least separation of centres</text><text x="520" y="216" text-anchor="start" class="label-dim">P: position angle, north through east</text><text x="520" y="244" text-anchor="start" class="label-dim">A larger s☉ moves I and II earlier</text><text x="520" y="262" text-anchor="start" class="label-dim">and III and IV later.</text><text x="8" y="422" text-anchor="start" class="label-dim">Schematic, geocentric. The planet is drawn about twenty times too large relative to the Sun.</text></svg>
