<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" class="figsvg"><title>Contact-time shift per arcsecond of contact radius</title><desc>A chart with the ratio of least separation to contact radius, b over L, from zero to 0.95 along the horizontal axis and the shift of a contact in seconds of time per arcsecond of contact radius, from zero to forty, on the vertical axis. Two rising curves start flat and steepen towards the right. The solid curve, for a relative motion of 240 arcseconds per hour, starts at 15 seconds per arcsecond. The dashed curve, for 355 arcseconds per hour, starts at about 10. Two open circles on the solid curve mark the 2012 and 2004 Venus transits near 19 and 21 seconds per arcsecond. Two squares mark the 2016 Mercury transit on the solid curve near 16 and the 2019 Mercury transit on the dashed curve near 10.</desc><line x1="76" y1="245" x2="640" y2="245" class="rule thin dotted"/><line x1="76" y1="180" x2="640" y2="180" class="rule thin dotted"/><line x1="76" y1="115" x2="640" y2="115" class="rule thin dotted"/><line x1="76" y1="50" x2="640" y2="50" class="rule thin dotted"/><text x="68" y="314" text-anchor="end" class="tick">0 s</text><text x="68" y="249" text-anchor="end" class="tick">10 s</text><text x="68" y="184" text-anchor="end" class="tick">20 s</text><text x="68" y="119" text-anchor="end" class="tick">30 s</text><text x="68" y="54" text-anchor="end" class="tick">40 s</text><line x1="76" y1="310" x2="76" y2="315" class="rule thin"/><text x="76" y="328" text-anchor="middle" class="tick">0.0</text><line x1="194.74" y1="310" x2="194.74" y2="315" class="rule thin"/><text x="194.74" y="328" text-anchor="middle" class="tick">0.2</text><line x1="313.47" y1="310" x2="313.47" y2="315" class="rule thin"/><text x="313.47" y="328" text-anchor="middle" class="tick">0.4</text><line x1="432.21" y1="310" x2="432.21" y2="315" class="rule thin"/><text x="432.21" y="328" text-anchor="middle" class="tick">0.6</text><line x1="550.95" 