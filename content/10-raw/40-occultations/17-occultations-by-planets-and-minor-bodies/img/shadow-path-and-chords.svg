d</text><line x1="568" y1="215" x2="582" y2="215" class="axis"/><line x1="575" y1="208" x2="575" y2="222" class="axis"/><circle cx="605" cy="189" r="5" class="rule"/><line x1="601" y1="193" x2="579" y2="212" class="accent-2" marker-end="url(#arrow)"/><text x="613" y="183" text-anchor="start" class="label-dim">ephemeris position</text><text x="567" y="233" text-anchor="end" class="label-dim">fitted centre</text><text x="575" y="26" text-anchor="middle" class="label-accent">after the event: chords on the same plane</text><text x="575" y="44" text-anchor="middle" class="label-dim">ellipse fit gives a′, b′, its angle and the offset</text><line x1="545" y1="352" x2="605" y2="352" class="rule" marker-end="url(#arrow)"/><text x="575" y="370" text-anchor="middle" class="label-dim">star motion relative to the body</text><text x="8" y="396" text-anchor="start" class="label-dim">Schematic. Widths, uncertainty and shape are illustrative, not an event.</text></svg>
