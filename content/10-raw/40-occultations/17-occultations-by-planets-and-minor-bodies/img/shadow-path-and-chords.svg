<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" class="figsvg"><title>Predicting and reducing a stellar occultation on the fundamental plane</title><desc>Two panels. Left: a circle for the Earth seen from the star, crossed diagonally by a band of constant width, the shadow of the occulting body. A dashed central line runs along the middle of the band, and a dashed line lies parallel to each edge, outside it, marking the 1-sigma uncertainty. An arrow shows the direction of motion. Right: an ellipse for the body&#x27;s outline with four horizontal solid chords across it, each ending in two dots, and one dotted horizontal line that misses the ellipse. A small plus marks the ellipse centre and a small open circle marks the ephemeris position, joined by a short arrow labelled as the astrometric offset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><circle cx="190" cy="215" r="140" class="body"/><line x1="38" y1="215" x2="346" y2="215" class="axis thin" marker-end="url(#arrow)"/><line x1="190" y1="363" x2="190" y2="59" class="axis thin" marker-end="url(#arrow)"/><text x="348" y="219" text-anchor="start" class="label-em">x</text><text x="196" y="61" text-anchor="start" class="label-em">y</text><polygon points="55.5,253.84 322.07,168.54 329.97,212.21 74.41,293.99" class="cone-deep"/><line x1="55.5" y1="253.84" x2="322.07" y2="168.54" class="accent"/><line x1="74.41" y1="293.99" x2="329.97" y2="212.21" class="accent"/><line x1="63.25" y1="274.46" x2="327.72" y2="189.83" class="axis dashed"/><line x1="51.32" y1="234.18" x2="314.05" y2="150.1" class="accent-2 dashed"/><line x1="87.81" y1="310.7" x2="328.76" y2="233.59" class="accent-2 dashed"/><line x1="211.18" y1="215.57" x2="277.85" y2="194.24" class="axis" marker-end="url(#arrow)"/><text x="281.85" y="188.24" text-anchor="start" class="label-dim">motion</text><text x="190" y="26" text-anchor="middle" class="label-accent">fundamental plane, seen along the star direction</text><text x="8" y="56" text-anchor="start" class="label-dim">1σ line: edge shifted by</text><text x="8" y="70" text-anchor="start" class="label-dim">the cross-track uncertainty</text><line x1="60" y1="76" x2="125.54" y2="210.43" class="rule thin"/><text x="300" y="372" text-anchor="start" class="label-dim">shadow: width D,</text><text x="300" y="386" text-anchor="start" class="label-dim">the body&#x27;s diameter</text><line x1="312" y1="362" x2="257.45" y2="191.86" class="rule thin"/><text x="8" y="330" text-anchor="start" class="label-dim">central line</text><line x1="40" y1="320" x2="90.72" y2="265.67" class="rule thin"/><text x="300" y="351" text-anchor="start" class="label">Earth</text><polyline points="678.84,173.04 680.23,176.89 681.33,180.83 682.14,184.87 682.65,189 682.87,193.19 682.79,197.45 682.42,201.75 681.75,206.09 680.79,210.45 679.54,214.83 678.01,219.2 676.19,223.57 674.09,227.91 671.72,232.21 669.09,236.47 666.2,240.67 663.06,244.8 659.68,248.85 656.06,252.8 652.23,256.65 648.18,260.39 643.93,264 639.49,267.48 634.88,270.82 630.1,274 625.17,277.02 620.1,279.87 614.91,282.54 609.61,285.03 604.22,287.32 598.74,289.42 593.2,291.31 587.61,292.99 581.99,294.46 576.35,295.72 570.7,296.75 565.06,297.55 559.46,298.13 553.89,298.49 548.38,298.61 542.95,298.5 537.6,298.17 532.36,297.61 527.23,296.82 522.23,295.81 517.38,294.57 512.69,293.12 508.16,291.45 503.82,289.58 499.68,287.5 495.74,285.22 492.02,282.74 488.52,280.09 485.27,277.25 482.26,274.24 479.5,271.08 477,267.75 474.78,264.29 472.83,260.68 471.16,256.96 469.77,253.11 468.67,249.17 467.86,245.13 467.35,241 467.13,236.81 467.21,232.55 467.58,228.25 468.25,223.91 469.21,219.55 470.46,215.17 471.99,210.8 473.81,206.43 475.91,202.09 478.28,197.79 480.91,193.53 483.8,189.33 486.94,185.2 490.32,181.15 493.94,177.2 497.77,173.35 501.82,169.61 506.07,166 510.51,162.52 515.12,159.18 519.9,