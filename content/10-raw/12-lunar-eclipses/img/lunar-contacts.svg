<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" class="figsvg"><title>The six contacts of a total lunar eclipse</title><desc>Two concentric circles centred on the shadow axis: the larger is the penumbra and the smaller the umbra. A straight line, the Moon&#x27;s track, crosses them above the centre, with a short perpendicular marked gamma from the centre to the track. Seven outlined Moon disks sit on the track from right to left: P1 touching the outside of the penumbra, U1 touching the outside of the umbra, U2 just inside the umbra, G at the point nearest the centre, U3 just inside the umbra on the other side, U4 touching its outside, and P4 touching the outside of the penumbra. Penumbral contacts are drawn dashed and umbral contacts solid.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><circle cx="380" cy="222" r="164.45" class="cone"/><circle cx="380" cy="222" r="94.76" class="cone-deep"/><circle cx="380" cy="222" r="164.45" class="rule thin dashed"/><circle cx="380" cy="222" r="94.76" class="rule"/><line x1="633.61" y1="141.12" x2="113.92" y2="214.16" class="axis" marker-end="url(#arrow)"/><line x1="380" y1="222" x2="373.77" y2="177.64" class="accent-2"/><text x="386" y="203.6" text-anchor="start" class="label-em">γ</text><circle cx="380" cy="222" r="2.2" class="accent-2-fill"/><circle cx="566.11" cy="150.6" r="34.88" class="rule dashed"/><circle cx="566.11" cy="150.6" r="1.8" class="accent-fill"/><text x="566.11" y="107.72" text-anchor="middle" class="label">P1</text><circle cx="494.23" cy="160.71" r="34.88" class="rule"/><circle cx="494.23" cy="160.71" r="1.8" class="accent-fill"/><text x="494.23" y="211.59" text-anchor="middle" class="label">U1</text><circle cx="413.11" cy="172.11" r="34.88" class="rule"/><circle cx="413.11" cy="172.11" r="1.8" class="accent-fill"/><text x="413.11" y="129.23" text-anchor="middle" class="label">U2</text><circle cx="373.77" cy="177.64" r="34.88" class="accent"/><circle cx="373.77" cy="177.64" r="1.8" class="accent-fill"/><text x="373.77" y="134.76" text-anchor="middle" class="label">G</text><circle cx="334.42" cy="183.17" r="34.88" class="rule"/><circle cx="334.42" cy="183.17" r="1.8" class="accent-fill"/><text x="334.42" y="140.29" text-anchor="middle" class="label">U3</text><circle cx="253.3" cy="194.57" r="34.88" class="rule"/><circle cx="253.3" cy="194.57" r="1.8" class="accent-fill"/><text x="253.3" y="245.45" text-anchor="middle" class="label">U4</text><circle cx="181.42" cy="204.67" r="34.88" class="rule dashed"/><circle cx="181.42" cy="204.67" r="1.8" class="accent-fill"/><text x="181.42" y="161.79" text-anchor="middle" class="label">P4</text><text x="498.41" y="363.43" text-anchor="start" class="label-dim">penumbra</text><text x="392" y="280.75" text-anchor="start" class="label-dim">umbra</text><text x="107.92" y="218.16" text-anchor="end" class="label-dim">Moon&#x27;s motion</text><text x="748" y="22" text-anchor="end" class="label-dim">north up, east left</text><text x="8" y="432" text-anchor="start" class="label-dim">Schematic to scale in Earth radii (ρ = 1.2848, σ = 0.7403, k = 0.2725, γ = 0.35); the straight track and its tilt are idealised.</text></svg>
