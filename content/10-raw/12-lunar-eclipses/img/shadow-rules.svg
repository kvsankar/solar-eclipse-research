<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" class="figsvg"><title>Atmospheric layer height implied by three umbra-enlargement rules</title><desc>A line chart. The horizontal axis is the Moon&#x27;s distance from 56 to 64 equatorial Earth radii. The vertical axis is the height in kilometres of the atmospheric layer that each rule effectively adds to the Earth. Chauvenet&#x27;s 2 per cent rule is a solid line falling from about 94 km at 56 Earth radii to about 90 km at 64 Earth radii. Danjon&#x27;s factor 1.01 is a dashed horizontal line near 74 km. Herald and Sinnott&#x27;s 0.0136 Earth radii, evaluated at a contact angle of 45 degrees, is a dotted horizontal line near 86.6 km. A shaded band from 82.2 to 90.7 km shows the spread of single-eclipse mean heights that Herald and Sinnott report.</desc><rect x="70" y="119.32" width="450" height="72.5" class="cone"/><text x="78" y="133.32" text-anchor="start" class="label-dim">single-eclipse means, 82.2 to 90.7 km (Herald and Sinnott)</text><line x1="70" y1="330" x2="520" y2="330" class="rule thin"/><line x1="70" y1="40" x2="70" y2="330" class="rule thin"/><line x1="70" y1="330" x2="70" y2="335" class="rule thin"/><text x="70" y="348" text-anchor="middle" class="tick">56</text><line x1="182.5" y1="330" x2="182.5" y2="335" class="rule thin"/><text x="182.5" y="348" text-anchor="middle" class="tick">58</text><line x1="295" y1="330" x2="295" y2="335" class="rule thin"/><text x="295" y="348" text-anchor="middle" class="tick">60</text><line x1="407.5" y1="330" x2="407.5" y2="335" class="rule thin"/><text x="407.5" y="348" text-anchor="middle" class="tick">62</text><line x1="520" y1="330" x2="520" y2="335" class="rule thin"/><text x="520" y="348" text-anchor="middle" class="tick">64</text><text x="295" y="368" text-anchor="middle" class="label-dim">lunar distance, equatorial Earth radii</text><line x1="65" y1="295.88" x2="70" y2="295.88" class="rule thin"/><text x="61" y="299.88" text-anchor="end" cla