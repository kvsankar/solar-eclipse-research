<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" class="figsvg"><title>The fundamental plane and the shadow cones</title><desc>A cross-section through the Sun, Moon and Earth. Tangents drawn to the outsides of the Sun and Moon form the umbral cone, which narrows to a vertex just inside the Earth. Tangents that cross between them form the penumbral cone, which widens past the Moon. A vertical line through the Earth&#x27;s centre, perpendicular to the shadow axis, is the fundamental plane. The penumbral radius l1 and the much smaller umbral radius l2 are measured on that plane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><polygon points="320,150 672,9.2 672,370.8 320,230" class="cone"/><polygon points="320,150 601.82,190 320,230" class="cone-deep"/><circle cx="10" cy="190" r="84" class="body"/><circle cx="320" cy="190" r="40" class="body"/><circle cx="560" cy="190" r="58" class="body"/><line x1="10" y1="190" x2="672" y2="190" class="axis dashed"/><line x1="320" y1="150" x2="601.82" y2="190" class="axis thin"/><line x1="320" y1="230" x2="601.82" y2="190" class="axis thin"/><line x1="320" y1="150" x2="672" y2="9.2" class="axis thin"/><line x1="320" y1="230" x2="672" y2="370.8" class="axis thin"/><line x1="560" y1="58" x2="560" y2="358" class="accent"/><text x="560" y="30" text-anchor="middle" class="label-accent">fundamental plane</text><text x="560" y="45" text-anchor="middle" class="label-dim">perpendicular to the axis, through the Earth&#x27;s centre</text><line x1="560" y1="190" x2="560" y2="54" class="accent-2" marker-end="url(#arrow)"/><text x="552" y="126" text-anchor="end" class="label-em">l₁</text><line x1="564" y1="187" x2="646" y2="236" class="rule thin"/><text x="650" y="240" text-anchor="start" class="label-em">l₂</text><text x="650" y="254" text-anchor="start" class="label-dim">negative: the vertex</text><text x="650" y="266" text-anchor="start" class="label-dim">is past the plane</text><text x="40" y="194" text-anchor="start" class="label">Sun</text><text x="320" y="139" text-anchor="middle" class="label">Moon</text><text x="560" y="268" text-anchor="middle" class="label">Earth</text><text x="126" y="183" text-anchor="start" class="label-dim">shadow axis</text><text x="432" y="160" text-anchor="middle" class="label-dim">umbral cone</text><text x="360" y="308" text-anchor="start" class="label-dim">penumbral cone</text><text x="601.82" y="177" text-anchor="middle" class="label-dim">vertex</text><text x="8" y="374" text-anchor="start" class="label-dim">Schematic. The Moon is drawn much larger relative to the Sun than it is.</text></svg>
