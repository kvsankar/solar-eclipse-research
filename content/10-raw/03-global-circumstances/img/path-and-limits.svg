<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 462" role="img" class="figsvg"><title>The umbral path and its limits on the Earth&#x27;s disc</title><desc>The Earth is drawn as a disc seen from the Sun. A pale region covers most of the disc and is labelled the penumbral outline, its edge a dashed arc low on the disc. A curve runs from limb to limb across the upper half of the disc: the central line, the track of the shadow axis. Five small dark ellipses sit on that curve at successive instants, each the umbra on the ground, smallest near the middle of the path and larger toward its ends where the surface tilts away. Two further curves, one dashed and one dotted, run either side of the central line and touch every one of the five ellipses. They are the northern and southern limits, drawn as the envelope of the moving ellipse, and they spread apart toward the ends of the path as the ellipses grow.</desc><defs><clipPath id="earthdisc"><circle cx="350" cy="240" r="170"/></clipPath></defs><g clip-path="url(#earthdisc)"><circle cx="350" cy="172" r="232" class="cone"/><circle cx="350" cy="172" r="232" class="accent-2 dashed"/></g><circle cx="350" cy="240" r="170" class="rule"/><polyline points="182.64,210.13 184.81,208.79 186.98,207.47 189.15,206.17 191.31,204.89 193.47,203.62 195.62,202.37 197.78,201.14 199.93,199.93 202.08,198.73 204.23,197.55 206.37,196.39 208.52,195.25 210.66,194.12 212.79,193.01 214.93,191.91 217.06,190.84 219.2,189.78 221.32,188.74 223.45,187.71 225.58,186.71 227.7,185.71 229.82,184.74 231.94,183.79 234.05,182.85 236.16,181.92 238.28,181.02 240.39,180.13 242.49,179.26 244.6,178.41 246.7,177.57 248.8,176.75 250.9,175.95 253,175.16 255.1,174.39 257.19,173.64 259.28,172.91 261.37,172.19 263.46,171.49 265.54,170.8 267.63,170.13 269.71,169.48 271.79,168.85 273.87,168.23 275.95,167.63 278.03,167.04 280.1,166.48 282.17,165.92 284.25,165.39 286.32,164.87 288.38,164.37 290.45,163.89 292.52,163.42 294.58,162.97 296.65,162.53 298.71,162.11 300.77,161.7