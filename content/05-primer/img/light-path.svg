<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" class="figsvg"><title>Three places a body can cut the light path</title><desc>A light source on the left sends light along three straight legs: to a body at the top that reflects it, from that body down to an observer on the right, and straight from the source to the observer. A small dark disc sits on each leg, numbered 1 to 3, with a short label saying what an observer notices when a body cuts that leg.</desc><line x1="80" y1="190" x2="360" y2="62" class="accent"/><line x1="360" y1="62" x2="610" y2="220" class="accent-2"/><line x1="80" y1="190" x2="610" y2="220" class="accent dashed"/><circle cx="80" cy="190" r="38" class="body"/><text x="80" y="248" text-anchor="middle" class="label">Source</text><text x="80" y="263" text-anchor="middle" class="label-dim">the Sun, or a star</text><circle cx="360" cy="62" r="18" class="body"/><text x="360" y="36" text-anchor="middle" class="label">A body lit by the source</text><circle cx="610" cy="220" r="22" class="body"/><text x="610" y="260" text-anchor="middle" class="label">Observer</text><circle cx="220" cy="126" r="11" class="body"/><text x="220" y="130" text-anchor="middle" class="label">1</text><text x="200" y="86" text-anchor="end" class="label">Darkened</text><text x="200" y="101" text-anchor="end" class="label-dim">the lit body goes dark</text><text x="200" y="116" text-anchor="end" class="label-dim">for everyone</text><circle cx="472.5" cy="133.1" r="11" class="body"/><text x="472.5" y="137.1" text-anchor="middle" class="label">2</text><text x="490.5" y="109.1" text-anchor="start" class="label">Hidden</text><text x="490.5" y="124.1" text-anchor="start" class="label-dim">the observer loses</text><text x="490.5" y="139.1" text-anchor="start" class="label-dim">sight of the lit body</text><circle cx="345" cy="205" r="11" class="body"/><text x="345" y="209" text-anchor="middle" class="label">3</text><text x="285" y="237" text-anchor="start" class="label">Both</text><text x="285" y="252" text-anchor="start" class="label-dim">the observer stands in a shadow</text><text x="285" y="267" text-anchor="start" class="label-dim">and sees the source hidden</text><text x="670" y="318" text-anchor="end" class="label-dim">Schematic, not to scale</text></svg>
