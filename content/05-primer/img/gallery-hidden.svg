<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Hidden: a body cuts the light reaching the observer</title><desc>Three panels. Left, lunar occultation of a star: parallel lines of starlight reach the Moon, and the observer behind the Moon cannot see the star. Middle, occultation of a satellite: Io half hidden behind Jupiter&#x27;s limb as the observer sees it. Right, occultation by an asteroid: the asteroid&#x27;s shadow in starlight crosses the Earth as a straight band, and observers inside the band see the star vanish.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><line x1="226.67" y1="24" x2="226.67" y2="210" class="rule thin dotted"/><line x1="453.33" y1="24" x2="453.33" y2="210" class="rule thin dotted"/><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="12" y1="96" x2="104" y2="96" class="accent thin" marker-end="url(#arrow)"/><line x1="12" y1="110" x2="104" y2="110" class="accent thin" marker-end="url(#arrow)"/><line x1="12" y1="124" x2="104" y2="124" class="accent thin" marker-end="url(#arrow)"/><circle cx="8" cy="110" r="3" class="accent-fill"/><rect x="130" y="92" width="70" height="36" class="cone"/><circle cx="130" cy="110" r="18" class="body"/><line x1="185" y1="114" x2="112" y2="114" class="accent-2 thin dotted"/><circle cx="185" cy="114" r="4" class="accent-2-fill"/><text x="130" y="86" text-anchor="middle" class="label-dim">Moon</text><text x="113.33" y="22" text-anchor="middle" class="label">Lunar occultation of a star</text><text x="113.33" y="192" text-anchor="middle" class="label-dim">the star vanishes at once:</text><text x="113.33" y="206" text-anchor="middle" class="label-dim">a point has no penumbra</text><circle cx="382.67" cy="102" r="7" class="body"/><circle cx="336.67" cy="110" r="44" class="body"/><text x="336.67" y="114" text-anchor="middle" class="label-dim">Jupiter</text><text x="394.67" y="96" text-anchor="start" class="label-dim">Io</text><text x="340" y="22" text-anchor="middle" class="label">Occultation of a satellite</text><text x="340" y="192" text-anchor="middle" class="label-dim">Io passing behind Jupiter,</text><text x="340" y="206" text-anchor="middle" class="label-dim">as the observer sees it</text><circle cx="563.33" cy="110" r="48" class="body"/><polygon points="493.33,76 633.33,106 633.33,120 493.33,90" class="cone-deep"/><line x1="493.33" y1="76" x2="633.33" y2="106" class="rule thin"/><line x1="493.33" y1="90" x2="633.33" y2="120" class="rule thin"/><circle cx="563.33" cy="98" r="3" class="accent-2-fill"/><text x="629.33" y="92" text-anchor="end" class="label-dim">shadow path</text><text x="563.33" y="144" text-anchor="middle" class="label-dim">Earth</text><text x="566.67" y="22" text-anchor="middle" class="label">Occultation by an asteroid</text><text x="566.67" y="192" text-anchor="middle" class="label-dim">its shadow path is as wide</text><text x="566.67" y="206" text-anchor="middle" class="label-dim">as the asteroid</text></svg>
