<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Darkened: the Earth blocks the sunlight reaching the Moon</title><desc>Left, the Sun, labelled light source. Middle, the Earth, labelled blocking body, with sunlight reaching it and its shadow stretching to the right. Right, the Moon inside that shadow, labelled darkened body. An observer on the Earth&#x27;s night side, labelled observer, looks along a dotted line at the darkened Moon.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="80" y1="70" x2="330" y2="86" class="rule thin"/><line x1="80" y1="154" x2="330" y2="138" class="rule thin"/><polygon points="330,86 640,103 640,121 330,138" class="cone-deep"/><circle cx="80" cy="112" r="42" class="sun-fill"/><circle cx="330" cy="112" r="26" class="body"/><circle cx="540" cy="112" r="12" class="body"/><circle cx="540" cy="112" r="12" class="cone-deep"/><circle cx="352" cy="102" r="3.5" class="accent-2-fill observer"/><line x1="356" y1="102" x2="525" y2="109" class="accent-2 thin dotted"/><line x1="352" y1="98" x2="400" y2="52" class="rule thin dotted"/><text x="80" y="180" text-anchor="middle" class="label">Light source</text><text x="80" y="195" text-anchor="middle" class="label-dim">the Sun</text><text x="330" y="164" text-anchor="middle" class="label">Blocking body</text><text x="330" y="179" text-anchor="middle" class="label-dim">the Earth</text><text x="540" y="150" text-anchor="middle" class="label">Darkened body</text><text x="540" y="165" text-anchor="middle" class="label-dim">the Moon</text><text x="540" y="180" text-anchor="middle" class="label-dim">in the Earth&#x27;s shadow</text><text x="404" y="34" text-anchor="start" class="label">Observer</text><text x="404" y="49" text-anchor="start" class="label-dim">on the Earth&#x27;s night side</text></svg>
