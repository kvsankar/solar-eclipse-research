<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Darkened: Io blocks the sunlight reaching Jupiter&#x27;s cloud tops</title><desc>Left, the Sun, labelled light source. Middle, Io, labelled blocking body, casting a long narrow shadow to the right. Right, Jupiter, labelled darkened body, with a small dark spot where Io&#x27;s shadow meets its cloud tops. Below, an observer on the Earth, labelled observer, looks along a dotted line at the spot.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="72" y1="66" x2="280" y2="104" class="rule thin"/><line x1="72" y1="158" x2="280" y2="120" class="rule thin"/><polygon points="280,104 500,107 500,117 280,120" class="cone-deep"/><circle cx="72" cy="112" r="46" class="sun-fill"/><circle cx="280" cy="112" r="8" class="body"/><circle cx="560" cy="112" r="64" class="body"/><circle cx="503" cy="112" r="6" class="cone-deep"/><circle cx="503" cy="112" r="6" class="cone-deep"/><circle cx="503" cy="112" r="6" class="rule thin"/><circle cx="405.77" cy="214.05" r="20" class="body"/><circle cx="420" cy="200" r="3.5" class="accent-2-fill observer"/><line x1="423" y1="196" x2="501" y2="120" class="accent-2 thin dotted"/><text x="72" y="184" text-anchor="middle" class="label">Light source</text><text x="72" y="199" text-anchor="middle" class="label-dim">the Sun</text><text x="280" y="146" text-anchor="middle" class="label">Blocking body</text><text x="280" y="161" text-anchor="middle" class="label-dim">Io</text><text x="560" y="30" text-anchor="middle" class="label">Darkened body</text><text x="560" y="45" text-anchor="middle" class="label-dim">Jupiter&#x27;s cloud tops, a patch</text><text x="374" y="212" text-anchor="end" class="label">Observer</text><text x="374" y="227" text-anchor="end" class="label-dim">on the Earth</text></svg>
