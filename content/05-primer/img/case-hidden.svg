<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Hidden: the Moon blocks the starlight reaching the observer</title><desc>Left, a star, labelled light source, sending parallel lines of light to the right. Middle, the Moon, labelled blocking body. The lines that meet the Moon stop there, and a pale band behind the Moon marks where the star cannot be seen. Lines above and below the Moon carry on. Right, an observer on the Earth, labelled observer, inside the band.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><rect x="330" y="90" width="270" height="44" class="cone"/><line x1="54" y1="74" x2="650" y2="74" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="150" x2="650" y2="150" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="100" x2="302" y2="100" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="112" x2="302" y2="112" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="124" x2="302" y2="124" class="accent thin" marker-end="url(#arrow)"/><circle cx="44" cy="112" r="6" class="sun-fill"/><circle cx="330" cy="112" r="22" class="body"/><path d="M 626 52 A 70 70 0 0 0 626 172" class="body"/><circle cx="600" cy="112" r="3.5" class="accent-2-fill"/><line x1="595" y1="112" x2="356" y2="112" class="accent-2 thin dotted"/><text x="58" y="170" text-anchor="middle" class="label">Light source</text><text x="58" y="185" text-anchor="middle" class="label-dim">a star</text><text x="330" y="174" text-anchor="middle" class="label">Blocking body</text><text x="330" y="189" text-anchor="middle" class="label-dim">the Moon</text><text x="590" y="188" text-anchor="middle" class="label">Observer</text><text x="590" y="203" text-anchor="middle" class="label-dim">on the Earth</text><text x="465" y="104" text-anchor="middle" class="label-dim">the star is hidden in this band</text></svg>
