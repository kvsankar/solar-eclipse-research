<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Both: the observer stands in a shadow and sees the Sun hidden</title><desc>Three panels. Left, solar eclipse: the Sun, the Moon and its shadow cone touching the Earth, with an observer inside it; an inset shows the Sun covered. Middle, transit of Venus: the Sun, Venus and its long narrow shadow, which ends far short of the Earth, so the observer is in the antumbra; an inset shows a small dark dot on the Sun. Right, the general rule: being inside a body&#x27;s shadow and seeing the source hidden by that body are the same thing.</desc><line x1="226.67" y1="24" x2="226.67" y2="210" class="rule thin dotted"/><line x1="453.33" y1="24" x2="453.33" y2="210" class="rule thin dotted"/><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><circle cx="28" cy="110" r="18" class="accent-fill"/><circle cx="110" cy="110" r="8" class="body"/><polygon points="110,102 170,108 170,112 110,118" class="cone-deep"/><path d="M 186 64 A 56 56 0 0 0 186 156" class="body"/><circle cx="172" cy="110" r="3" class="accent-2-fill"/><text x="110" y="96" text-anchor="middle" class="label-dim">Moon</text><text x="200" y="60" text-anchor="end" class="label-dim">Earth</text><circle cx="160" cy="166" r="13" class="accent-fill"/><circle cx="160" cy="166" r="17" class="accent thin dotted"/><circle cx="160" cy="166" r="13.5" class="sky-fill"/><text x="113.33" y="22" text-anchor="middle" class="label">Solar eclipse</text><text x="113.33" y="192" text-anchor="middle" class="label-dim">the observer in the Moon&#x27;s</text><text x="113.33" y="206" text-anchor="middle" class="label-dim">umbra sees the Sun covered</text><circle cx="254.67" cy="110" r="18" class="accent-fill"/><circle cx="306.67" cy="110" r="4" class="body"/><polygon points="306.67,106 356.67,110 306.67,114" class="cone-deep"/><polygon points="356.67,110 416.67,105 416.67,115" class="cone"/><path d="M 428.66666666666663 64 A 56 56 0 0 0 428.66666666666663 156" class="body"/><circle cx="414.67" cy="110" r="3" class="accent-2-fill"/><text x="306.67" y="100" text-anchor="middle" class="label-dim">Venus</text><text x="376.67" y="96" text-anchor="middle" class="label-dim">antumbra</text><circle cx="386.67" cy="166" r="13" class="accent-fill"/><circle cx="390.67" cy="163" r="2.5" class="sky-fill"/><text x="340" y="22" text-anchor="middle" class="label">Transit of Venus</text><text x="340" y="192" text-anchor="middle" class="label-dim">the observer in the antumbra</text><text x="340" y="206" text-anchor="middle" class="label-dim">sees a dot on the Sun</text><text x="566.67" y="52" text-anchor="middle" class="label">Inside a body&#x27;s shadow,</text><text x="566.67" y="68" text-anchor="middle" class="label">the source is hidden</text><text x="566.67" y="84" text-anchor="middle" class="label">behind that body.</text><text x="566.67" y="100" text-anchor="middle" class="label"></text><text x="566.67" y="116" text-anchor="middle" class="label">A total eclipse is the umbra,</text><text x="566.67" y="132" text-anchor="middle" class="label">an annular eclipse or a</text><text x="566.67" y="148" text-anchor="middle" class="label">transit the antumbra,</text><text x="566.67" y="164" text-anchor="middle" class="label">a partial eclipse the penumbra.</text><text x="566.67" y="22" text-anchor="middle" class="label">The same event, two ways</text><text x="566.67" y="192" text-anchor="middle" class="label-dim"></text><text x="566.67" y="206" text-anchor="middle" class="label-dim"></text></svg>
