<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" class="figsvg"><title>One orbit of Io: four kinds of event</title><desc>A view from above Jupiter. Sunlight comes from the left, so Jupiter&#x27;s shadow is a band to its right. The Earth lies off to the lower left, so Jupiter hides a band behind it to the upper right as seen from the Earth. Io&#x27;s orbit is a dashed circle with four labelled places: on the Sun side its shadow falls on Jupiter; on the Earth side it crosses in front of Jupiter; behind Jupiter as seen from the Earth it is occulted; in the shadow it is eclipsed. Io sits in the shadow at the still frame. When played, Io goes round the orbit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><rect x="300" y="147" width="330" height="76" class="cone-deep"/><text x="560" y="139" text-anchor="middle" class="label-dim">Jupiter&#x27;s shadow</text><polygon points="319,217.91 578.81,67.91 540.81,2.09 281,152.09" class="cone"/><text x="515.87" y="80" text-anchor="start" class="label-dim">hidden from the Earth</text><circle cx="300" cy="185" r="122" class="rule dashed"/><circle cx="300" cy="185" r="38" class="body"/><text x="300" y="189" text-anchor="middle" class="label">Jupiter</text><line x1="110" y1="34" x2="40" y2="34" class="accent" marker-end="url(#arrow)"/><text x="118" y="38" text-anchor="start" class="label">to the Sun</text><line x1="170.1" y1="260" x2="100.81" y2="300" class="accent-2" marker-end="url(#arrow)"/><text x="99.62" y="321" text-anchor="middle" class="label">to the Earth</text><circle cx="178" cy="185" r="3" class="accent-2-fill"/><text x="168" y="175" text-anchor="end" class="label">shadow transit</text><circle cx="194.34" cy="246" r="3" class="accent-2-fill"/><text x="182.34" y="264" text-anchor="end" class="label">transit</text><circle cx="405.66" cy="124" r="3" class="accent-2-fill"/><text x="415.66" y="116" text-anchor="start" class="label">occultation</text><circle cx="422" cy="185" r="3" class="accent-2-fill"/><text x="434" y="207" text-anchor="start" class="label">eclipse</text><g><circle cx="422" cy="185" r="8" class="body"/><circle cx="422" cy="185" r="8" class="rule"/><text x="422" y="171" text-anchor="middle" class="label">Io</text><animateTransform attributeName="transform" type="rotate" values="0 300 185;-360 300 185" dur="14s" begin="indefinite" repeatCount="indefinite"/></g><text x="670" y="362" text-anchor="end" class="label-dim">Schematic, not to scale; angles exaggerated</text></svg>
