<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img" class="figsvg"><title>One orbit of Io: four kinds of event</title><desc>A view from above Jupiter. Sunlight comes from the left, so Jupiter&#x27;s shadow is a band to its right. The Earth lies off to the lower left, so Jupiter hides a band behind it to the upper right as seen from the Earth. Io&#x27;s orbit is a dashed circle with four labelled places: on the Sun side its shadow falls on Jupiter; on the Earth side it crosses in front of Jupiter; behind Jupiter as seen from the Earth it is occulted; in the shadow it is eclipsed. Io sits in the shadow at the still frame. When played, Io goes round the orbit. A framed panel on the right shows what an observer on the Earth sees: Jupiter&#x27;s disc with Io beside it, crossing in front, hidden behind or dark in the shadow, and Io&#x27;s shadow as a dot on Jupiter, with the event&#x27;s name lit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><rect x="300" y="147" width="330" height="76" class="cone-deep"/><text x="560" y="139" text-anchor="middle" class="label-dim">Jupiter&#x27;s shadow</text><polygon points="319,217.91 578.81,67.91 540.81,2.09 281,152.09" class="cone"/><text x="515.87" y="80" text-anchor="start" class="label-dim">hidden from the Earth</text><circle cx="300" cy="185" r="122" class="rule dashed"/><circle cx="300" cy="185" r="38" class="body"/><text x="300" y="183" text-anchor="middle" class="label">Jupiter</text><text x="300" y="197" text-anchor="middle" class="label-dim">the planet</text><line x1="110" y1="34" x2="40" y2="34" class="accent" marker-end="url(#arrow)"/><text x="118" y="32" text-anchor="start" class="label">Light source</text><text x="118" y="46" text-anchor="start" class="label-dim">the Sun, this way</text><line x1="170.1" y1="260" x2="100.81" y2="300" class="accent-2" marker-end="url(#arrow)"/><text x="99.62" y="319" text-anchor="middle" class="label">Observer</text><text x="99.62" y="333" text-anchor="middle" class="label-dim">on the Earth, this way</text><circle cx="178" cy="185" r="3" class="accent-2-fill"/><text x="168" y="175" text-anchor="end" class="label">shadow transit</text><circle cx="194.34" cy="246" r="3" class="accent-2-fill"/><text x="182.34" y="264" text-anchor="end" class="label">transit</text><circle cx="405.66" cy="124" r="3" class="accent-2-fill"/><text x="415.66" y="116" text-anchor="start" class="label">occultation</text><circle cx="422" cy="185" r="3" class="accent-2-fill"/><text x="434" y="207" text-anchor="start" class="label">eclipse</text><g transform="translate(422 185)"><circle cx="0" cy="0" r="8" class="body"/><circle cx="0" cy="0" r="8" class="rule"/><text x="0" y="-14" text-anchor="middle" class="label">Io</text><animateMotion path="M0,0 A122,122 0 1 0 -244,0 A122,122 0 1 0 0,0" dur="14s" begin="indefinite" repeatCount="indefinite"/></g><rect x="692" y="30" width="176" height="214" rx="6" class="panel"/><text x="780" y="50" text-anchor="middle" class="label">What the observer sees</text><text x="780" y="65" text-anchor="middle" class="label-dim">from the Earth</text><circle cx="780" cy="128" r="23.56" class="body"/><circle cx="780" cy="128" r="2.6" class="silhouette-fill" opacity="0"><animate attributeName="cx" values="780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;780;756.49;757.35;758.85;760.75;762.98;765.48;768.22;771.19;774.4;777.85;781.6;785.71;790.4;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.63;796.