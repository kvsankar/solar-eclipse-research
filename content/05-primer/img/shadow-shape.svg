<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" class="figsvg"><title>Cone and cylinder: the two shapes of a shadow</title><desc>Top: a large source disc on the left and a small body in the middle. The umbra narrows behind the body to a point and opens out again beyond it as the antumbra. The wider penumbra spreads around both. Three observers sit in the umbra, the penumbra and the antumbra, each linked to a small inset of the source disc: wholly covered, partly covered, and covered except for a ring. Bottom: parallel lines from a star at the far left pass a body and leave a straight band behind it, the cylinder, with an observer in it for whom the star is hidden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><polygon points="300,124 660,39.29 660,240.71 300,156" class="cone"/><polygon points="300,124 458.67,140 300,156" class="cone-deep"/><polygon points="458.67,140 660,119.7 660,160.3" class="cone-deep"/><polyline points="300,124 660,39.29" class="rule thin dashed"/><polyline points="300,156 660,240.71" class="rule thin dashed"/><polyline points="300,124 458.67,140 660,119.7" class="rule thin"/><polyline points="300,156 458.67,140 660,160.3" class="rule thin"/><line x1="62" y1="100" x2="300" y2="124" class="rule thin"/><line x1="62" y1="100" x2="300" y2="156" class="rule thin dashed"/><line x1="62" y1="180" x2="300" y2="156" class="rule thin"/><line x1="62" y1="180" x2="300" y2="124" class="rule thin dashed"/><circle cx="62" cy="140" r="40" class="body"/><text x="62" y="198" text-anchor="middle" class="label">Extended source</text><text x="62" y="212" text-anchor="middle" class="label-dim">the Sun</text><circle cx="300" cy="140" r="16" class="body"/><text x="300" y="112" text-anchor="middle" class="label">Body</text><text x="369.33" y="144" text-anchor="middle" class="label">umbra</text><text x="600" y="144" text-anchor="middle" class="label">antumbra</text><text x="560" y="80.82" text-anchor="middle" class="label">penumbra</text><circle cx="436.67" cy="140" r="4" class="accent-fill"/><line x1="436.67" y1="145" x2="330" y2="262" class="accent thin dotted"/><circle cx="330" cy="280" r="15" class="accent-fill"/><circle cx="330" cy="280" r="16" class="sky-fill"/><text x="330" y="312" text-anchor="middle" class="label">umbra: total</text><circle cx="500" cy="180" r="4" class="accent-fill"/><line x1="500" y1="185" x2="470" y2="262" class="accent thin dotted"/><circle cx="470" cy="280" r="15" class="accent-fill"/><circle cx="482" cy="274" r="15" class="sky-fill"/><text x="470" y="312" text-anchor="middle" class="label">penumbra: partial</text><circle cx="620" cy="150" r="4" class="accent-fill"/><line x1="620" y1="155" x2="610" y2="262" class="accent thin dotted"/><circle cx="610" cy="280" r="15" class="accent-fill"/><circle cx="610" cy="280" r="10.5" class="sky-fill"/><text x="610" y="312" text-anchor="middle" class="label">antumbra: annular</text><line x1="20" y1="335" x2="660" y2="335" class="rule thin dashed"/><line x1="20" y1="364" x2="270" y2="364" class="accent thin" marker-end="url(#arrow)"/><line x1="20" y1="382" x2="270" y2="382" class="accent thin" marker-end="url(#arrow)"/><line x1="20" y1="418" x2="270" y2="418" class="accent thin" marker-end="url(#arrow)"/><line x1="20" y1="436" x2="270" y2="436" class="accent thin" marker-end="url(#arrow)"/><rect x="300" y="384" width="360" height="32" class="cone-deep"/><line x1="300" y1="384" x2="660" y2="384" class="rule thin"/><line x1="300" y1="416" x2="660" y2="416" class="rule thin"/><circle cx="300" cy="400" r="16" class="body"/><text x="20" y="462" text-anchor="start" class="label">Star: a point at infinity, so its light arrives in parallel lines</text><text x="470" y="374" text-anchor="middle" class="label">cylinder: no penumbra</text><circle cx="610" cy="400" r="4" class="accent-fill"/><text x="610" y="434" text-anchor="middle" class="label-dim">star hidden</text><text x="670" y="474" text-anchor="end" class="label-dim">Schematic, not to scale</text></svg>
