<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" class="figsvg"><title>Cone and cylinder: the two shapes of a shadow</title><desc>Top: a large source disc on the left and a small body in the middle. The umbra narrows behind the body to a point and opens out again beyond it as the antumbra. The wider penumbra spreads around both. Three observers sit in the umbra, the penumbra and the antumbra. A framed panel below shows what each one sees of the source disc: wholly covered, partly covered, and covered except for a ring. Bottom: parallel lines from a star at the far left pass a body and leave a straight band behind it, the cylinder, with an observer in it for whom the star is hidden.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><polygon points="300,124 660,39.29 660,240.71 300,156" class="cone"/><polygon points="300,124 458.67,140 300,156" class="cone-deep"/><polygon points="458.67,140 660,119.7 660,160.3" class="cone-deep"/><polyline points="300,124 660,39.29" class="rule thin dashed"/><polyline points="300,156 660,240.71" class="rule thin dashed"/><polyline points="300,124 458.67,140 660,119.7" class="rule thin"/><polyline points="300,156 458.67,140 660,160.3" class="rule thin"/><line x1="62" y1="100" x2="300" y2="124" class="rule thin"/><line x1="62" y1="100" x2="300" y2="156" class="rule thin dashed"/><line x1="62" y1="180" x2="300" y2="156" class="rule thin"/><line x1="62" y1="180" x2="300" y2="124" class="rule thin dashed"/><circle cx="62" cy="140" r="40" class="sun-fill"/><text x="62" y="198" text-anchor="middle" class="label">Light source</text><text x="62" y="212" text-anchor="middle" class="label-dim">the Sun, a disc</text><circle cx="300" cy="140" r="16" class="body"/><text x="300" y="98" text-anchor="middle" class="label">Blocking body</text><text x="300" y="113" text-anchor="middle" class="label-dim">the Moon</text><text x="369.33" y="144" text-anchor="middle" class="label">umbra</text><text x="600" y="144" text-anchor="middle" class="label">antumbra</text><text x="560" y="80.82" text-anchor="middle" class="label">penumbra</text><rect x="20" y="248" width="640" height="96" rx="6" class="panel"/><text x="34" y="270" text-anchor="start" class="label">What the observer sees</text><circle cx="436.67" cy="140" r="4" class="accent-fill"/><circle cx="270" cy="290" r="15" class="sun-fill"/><circle cx="270" cy="290" r="17" class="sun-fill"/><circle cx="270" cy="290" r="15" class="silhouette-fill"/><text x="270" y="324" text-anchor="middle" class="label-dim">in the umbra: total</text><circle cx="500" cy="180" r="4" class="accent-fill"/><circle cx="430" cy="290" r="15" class="sun-fill"/><circle cx="442" cy="284" r="15" class="silhouette-fill"/><text x="430" y="324" text-anchor="middle" class="label-dim">in the penumbra: partial</text><circle cx="620" cy="150" r="4" class="accent-fill"/><circle cx="590" cy="290" r="15" class="sun-fill"/><circle cx="590" cy="290" r="10.5" class="silhouette-fill"/><text x="590" y="324" text-anchor="middle" class="label-dim">in the antumbra: annular</text><line x1="20" y1="352" x2="660" y2="352" class="rule thin dashed"/><line x1="26" y1="376" x2="250" y2="376" class="accent thin" marker-end="url(#arrow)"/><line x1="26" y1="390" x2="250" y2="390" class="accent thin" marker-end="url(#arrow)"/><line x1="26" y1="406" x2="250" y2="406" class="accent thin" marker-end="url(#arrow)"/><line x1="26" y1="420" x2="250" y2="420" class="accent thin" marker-end="url(#arrow)"/><rect x="300" y="382" width="360" height="32" class="cone-deep"/><line x1="300" y1="382" x2="660" y2="382" class="rule thin"/><line x1="300" y1="414" x2="660" y2="414" class="rule thin"/><circle cx="300" cy="398" r="16" class="body"/><circle cx="14" cy="398" r="4" class="sun-fill"/><text x="20" y="442" text-anchor="start" class="label">Light source</text><text x="20" y="456" text-anchor="start" class="label-dim">a star: a point at infinity, so its light arrives in parallel lines</text><text x="300" y="358" text-anchor="middle" class="label">Blocking body</text><text x="300" y="373" text-anchor="middle" class="label-dim">the Moon</text><text x="470" y="372" text-anchor="middle" class="label">cylinder: no penumbra</text><circle cx="610" cy="398" r="4" class="accent-fill"/><text x="610" y="434" text-anchor="middle" class="label">Observer</text><text x="610" y="448" text-anchor="middle" class="label-dim">the star is hidden</text><text x="670" y="474" text-anchor="end" class="label-dim">Schematic, not to scale</text></svg>
