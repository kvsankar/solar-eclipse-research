<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" class="figsvg"><title>The Moon&#x27;s shadow crossing the Earth, and what one observer sees</title><desc>Left: the Earth&#x27;s disc with the Moon&#x27;s shadow on it, a wide pale penumbra around a small dark umbra, centred on an observer marked with a dot. Right: the observer&#x27;s sky, with the Sun covered by the Moon. When played, the shadow slides across the Earth from left to right while, on the right, the Moon slides across the Sun, covering it fully only while the umbra is on the observer.</desc><defs><clipPath id="earth"><circle cx="170" cy="140" r="105"/></clipPath><clipPath id="sky"><rect x="360" y="20" width="300" height="240"/></clipPath></defs><circle cx="170" cy="140" r="105" class="body"/><g clip-path="url(#earth)"><g><circle cx="170" cy="140" r="58" class="cone"/><circle cx="170" cy="140" r="6" class="cone-deep"/><animateTransform attributeName="transform" type="translate" values="-220 -44.0;220 44.0" dur="10s" begin="indefinite" repeatCount="indefinite"/></g></g><circle cx="170" cy="140" r="105" class="rule"/><circle cx="170" cy="140" r="3.5" class="accent-2-fill observer"/><text x="170" y="267" text-anchor="middle" class="label">The Moon&#x27;s shadow crossing the Earth</text><text x="178" y="122" text-anchor="start" class="label">Observer</text><text x="178" y="136" text-anchor="start" class="label-dim">on the Earth</text><circle cx="510" cy="140" r="53" class="accent thin dotted"/><circle cx="510" cy="140" r="39" class="sun-fill"/><g clip-path="url(#sky)"><circle cx="510" cy="140" r="48" class="silhouette-fill"><animate attributeName="cx" values="840.0;180.0" dur="10s" begin="indefinite" repeatCount="indefinite"/><animate attributeName="cy" values="206.0;74.0" dur="10s" begin="indefinite" repeatCount="indefinite"/></circle></g><text x="510" y="267" text-anchor="middle" class="label">What the observer sees</text><text x="510" y="282" text-anchor="middle" class="label-dim">still frame: the Sun covered, totality</text><text x="375" y="34" text-anchor="start" class="label">Light source</text><text x="375" y="48" text-anchor="start" class="label-dim">the Sun, behind</text><text x="645" y="34" text-anchor="end" class="label">Blocking body</text><text x="645" y="48" text-anchor="end" class="label-dim">the Moon, the dark disc</text><text x="670" y="16" text-anchor="end" class="label-dim">Schematic, not to scale</text></svg>
