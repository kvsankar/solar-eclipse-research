<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Hidden: an asteroid blocks the starlight reaching part of the Earth</title><desc>Left, a star, labelled light source, sending parallel lines of light. Middle, a small asteroid, labelled blocking body. Behind it a narrow band, its shadow in starlight, reaches the Earth on the right, which is drawn as a disc with the band crossing it. An observer inside the band, labelled observer, loses the star. Observers outside the band see nothing happen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" class="arrowhead"/></marker></defs><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="54" y1="82" x2="480" y2="82" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="142" x2="480" y2="142" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="108" x2="287" y2="108" class="accent thin" marker-end="url(#arrow)"/><line x1="54" y1="116" x2="287" y2="116" class="accent thin" marker-end="url(#arrow)"/><circle cx="560" cy="112" r="70" class="body"/><rect x="300" y="105" width="330" height="14" class="cone-deep"/><circle cx="44" cy="112" r="6" class="sun-fill"/><circle cx="300" cy="112" r="7" class="body"/><circle cx="540" cy="112" r="3.5" class="accent-2-fill"/><text x="560" y="200" text-anchor="middle" class="label-dim">the Earth</text><text x="560" y="214" text-anchor="middle" class="label-dim">outside the band: nothing happens</text><text x="58" y="164" text-anchor="middle" class="label">Light source</text><text x="58" y="179" text-anchor="middle" class="label-dim">a star</text><text x="300" y="50" text-anchor="middle" class="label">Blocking body</text><text x="300" y="65" text-anchor="middle" class="label-dim">an asteroid</text><text x="626" y="20" text-anchor="end" class="label">Observer</text><text x="626" y="35" text-anchor="end" class="label-dim">on the Earth, in the shadow path</text><line x1="540" y1="106" x2="540" y2="40" class="rule thin dotted"/></svg>
