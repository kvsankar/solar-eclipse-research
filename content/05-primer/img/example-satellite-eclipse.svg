<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Darkened: Jupiter blocks the sunlight reaching Io</title><desc>Left, the Sun, labelled light source. Middle, Jupiter, labelled blocking body, with its shadow stretching to the right. Inside the shadow, Io, labelled darkened body. Below, an observer on the Earth, labelled observer, looks up along a dotted line at the darkened Io.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="72" y1="66" x2="300" y2="82" class="rule thin"/><line x1="72" y1="158" x2="300" y2="142" class="rule thin"/><polygon points="300,82 650,90 650,134 300,142" class="cone-deep"/><circle cx="72" cy="112" r="46" class="sun-fill"/><circle cx="300" cy="112" r="30" class="body"/><circle cx="520" cy="112" r="8" class="body"/><circle cx="520" cy="112" r="8" class="cone-deep"/><circle cx="598.61" cy="204.66" r="20" class="body"/><circle cx="585" cy="190" r="3.5" class="accent-2-fill observer"/><line x1="582" y1="186" x2="524" y2="122" class="accent-2 thin dotted"/><text x="72" y="184" text-anchor="middle" class="label">Light source</text><text x="72" y="199" text-anchor="middle" class="label-dim">the Sun</text><text x="300" y="168" text-anchor="middle" class="label">Blocking body</text><text x="300" y="183" text-anchor="middle" class="label-dim">Jupiter</text><text x="520" y="44" text-anchor="middle" class="label">Darkened body</text><text x="520" y="59" text-anchor="middle" class="label-dim">Io, in Jupiter&#x27;s shadow</text><text x="573" y="184" text-anchor="end" class="label">Observer</text><text x="573" y="199" text-anchor="end" class="label-dim">on the Earth</text></svg>
