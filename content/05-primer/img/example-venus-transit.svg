<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 250" role="img" class="figsvg"><title>Hidden: the observer stands in Venus&#x27;s antumbra and sees a dot on the Sun</title><desc>Left, the Sun, labelled light source. Middle, Venus, labelled blocking body, small. Its dark umbra closes to a point a short way behind it, and beyond that point the antumbra opens out towards the Earth on the right. An observer on the Earth, labelled observer, stands in the antumbra. A framed panel on the right shows what the observer sees: a small dark dot on the Sun&#x27;s disc.</desc><text x="860" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="80" y1="68" x2="260" y2="106" class="rule thin"/><line x1="80" y1="156" x2="260" y2="118" class="rule thin"/><polygon points="260,106 320,112 260,118" class="cone-deep"/><polygon points="320,112 590,86 590,138" class="cone"/><polyline points="260,106 320,112 590,86" class="rule thin"/><polyline points="260,118 320,112 590,138" class="rule thin"/><circle cx="80" cy="112" r="44" class="sun-fill"/><circle cx="260" cy="112" r="6" class="body"/><circle cx="660" cy="112" r="100" class="body"/><circle cx="561" cy="112" r="3.5" class="accent-2-fill observer"/><text x="455" y="116" text-anchor="middle" class="label-dim">antumbra</text><rect x="680" y="0" width="190" height="250" class="panel-ground"/><rect x="694" y="22" width="166" height="186" rx="6" class="panel"/><text x="777" y="42" text-anchor="middle" class="label">What the observer sees</text><circle cx="777" cy="123" r="40" class="sun-fill"/><circle cx="790" cy="116" r="5.5" class="silhouette-fill"/><text x="777" y="185" text-anchor="middle" class="label-dim">Venus, a dot on the Sun</text><text x="80" y="182" text-anchor="middle" class="label">Light source</text><text x="80" y="197" text-anchor="middle" class="label-dim">the Sun</text><text x="260" y="148" text-anchor="middle" class="label">Blocking body</text><text x="260" y="163" text-anchor="middle" class="label-dim">Venus</text><text x="516" y="174" text-anchor="middle" class="label">Observer</text><text x="516" y="189" text-anchor="middle" class="label-dim">on the Earth</text><text x="516" y="204" text-anchor="middle" class="label-dim">in Venus&#x27;s antumbra</text></svg>
