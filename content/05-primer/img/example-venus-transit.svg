<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Both: Venus blocks part of the observer&#x27;s view of the Sun</title><desc>Left, the Sun, labelled light source. Middle, Venus, labelled blocking body, small. Its dark umbra closes to a point a short way behind it, and beyond that point the antumbra opens out towards the Earth on the right. An observer on the Earth, labelled observer, stands in the antumbra. An inset shows what the observer sees: a small dark dot on the Sun&#x27;s disc.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="80" y1="68" x2="260" y2="106" class="rule thin"/><line x1="80" y1="156" x2="260" y2="118" class="rule thin"/><polygon points="260,106 320,112 260,118" class="cone-deep"/><polygon points="320,112 580,86 580,138" class="cone"/><polyline points="260,106 320,112 580,86" class="rule thin"/><polyline points="260,118 320,112 580,138" class="rule thin"/><circle cx="80" cy="112" r="44" class="sun-fill"/><circle cx="260" cy="112" r="6" class="body"/><path d="M 600 42 A 80 80 0 0 0 600 182" class="body"/><circle cx="578" cy="112" r="3.5" class="accent-2-fill"/><text x="450" y="116" text-anchor="middle" class="label-dim">antumbra</text><circle cx="610" cy="30" r="18" class="sun-fill"/><circle cx="616" cy="27" r="2.6" class="sky-fill"/><line x1="580" y1="106" x2="602" y2="48" class="accent-2 thin dotted"/><text x="584" y="34" text-anchor="end" class="label-dim">what they see</text><text x="80" y="182" text-anchor="middle" class="label">Light source</text><text x="80" y="197" text-anchor="middle" class="label-dim">the Sun</text><text x="260" y="148" text-anchor="middle" class="label">Blocking body</text><text x="260" y="163" text-anchor="middle" class="label-dim">Venus</text><text x="516" y="174" text-anchor="middle" class="label">Observer</text><text x="516" y="189" text-anchor="middle" class="label-dim">on the Earth</text><text x="516" y="204" text-anchor="middle" class="label-dim">in Venus&#x27;s antumbra</text></svg>
