<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Hidden: Jupiter blocks the observer&#x27;s view of Io</title><desc>Top left, the Sun, labelled light source, lighting Io along a line. Left, Io, labelled lit body. Middle, Jupiter, labelled blocking body, with a pale band stretching left from it: seen from the Earth, anything in that band is behind Jupiter. Io sits inside the band. Right, an observer on the Earth, labelled observer, whose dotted line of sight towards Io ends at Jupiter.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><rect x="150" y="90" width="230" height="76" class="cone"/><line x1="104" y1="64" x2="192" y2="124" class="rule thin"/><circle cx="78" cy="52" r="30" class="sun-fill"/><circle cx="200" cy="128" r="8" class="body"/><circle cx="380" cy="128" r="38" class="body"/><circle cx="620" cy="128" r="3.5" class="accent-2-fill"/><line x1="615" y1="128" x2="422" y2="128" class="accent-2 thin dotted"/><text x="270" y="82" text-anchor="middle" class="label-dim">seen from the Earth, Io is behind Jupiter here</text><text x="120" y="46" text-anchor="start" class="label">Light source</text><text x="120" y="61" text-anchor="start" class="label-dim">the Sun</text><text x="200" y="192" text-anchor="middle" class="label">Lit body</text><text x="200" y="207" text-anchor="middle" class="label-dim">Io</text><text x="380" y="192" text-anchor="middle" class="label">Blocking body</text><text x="380" y="207" text-anchor="middle" class="label-dim">Jupiter</text><text x="612" y="158" text-anchor="middle" class="label">Observer</text><text x="612" y="173" text-anchor="middle" class="label-dim">on the Earth</text></svg>
