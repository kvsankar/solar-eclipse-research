<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" class="figsvg"><title>The Moon passing through the Earth&#x27;s shadow</title><desc>The Earth&#x27;s shadow at the Moon&#x27;s distance, seen face on: a dark inner disc, the umbra, inside a paler ring, the penumbra. The Moon sits in the middle of the umbra, tinted copper. When played, the Moon moves from left to right through the penumbra and the umbra and out again, its copper tint deepening inside the umbra and fading outside it.</desc><circle cx="340" cy="135" r="95" class="cone"/><circle cx="340" cy="135" r="58" class="cone-deep"/><circle cx="340" cy="135" r="95" class="rule thin dashed"/><circle cx="340" cy="135" r="58" class="rule thin"/><line x1="40" y1="145" x2="640" y2="145" class="rule thin dotted"/><text x="340" y="71" text-anchor="middle" class="label-dim">the Earth&#x27;s umbra</text><text x="340" y="35" text-anchor="middle" class="label-dim">the Earth&#x27;s penumbra</text><g><circle cx="340" cy="145" r="22" class="body"/><text x="340" y="185" text-anchor="middle" class="label">Darkened body</text><text x="340" y="199" text-anchor="middle" class="label-dim">the Moon</text><circle cx="340" cy="145" r="22" class="accent-fill" opacity="0.8"><animate attributeName="opacity" values="0;0;0.2;0.8;0.8;0.2;0;0" keyTimes="0;0.305;0.367;0.44;0.56;0.633;0.695;1" dur="12s" begin="indefinite" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="-300 0;300 0" dur="12s" begin="indefinite" repeatCount="indefinite"/></g><text x="10" y="20" text-anchor="start" class="label">Light source</text><text x="10" y="34" text-anchor="start" class="label-dim">the Sun, behind the Earth</text><text x="10" y="54" text-anchor="start" class="label">Blocking body</text><text x="10" y="68" text-anchor="start" class="label-dim">the Earth, casting this shadow</text><text x="670" y="20" text-anchor="end" class="label">Observer</text><text x="670" y="34" text-anchor="end" class="label-dim">anyone on the Earth&#x27;s night side</text><text x="340" y="272" text-anchor="middle" class="label-dim">Still frame: totality. The Moon is in the umbra and lit only by sunlight bent through the Earth&#x27;s atmosphere.</text><text x="670" y="250" text-anchor="end" class="label-dim">Schematic, not to scale</text></svg>
