<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Both: the Moon blocks the observer&#x27;s view of the Sun</title><desc>Left, the Sun, labelled light source. Middle, the Moon, labelled blocking body, with sunlight reaching it. Behind the Moon a pale penumbra spreads out and a darker umbra narrows towards the Earth on the right. An observer on the Earth, labelled observer, stands where the umbra meets the Earth. An inset above shows what the observer sees: the Sun covered by the Moon.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="80" y1="70" x2="300" y2="99" class="rule thin"/><line x1="80" y1="154" x2="300" y2="125" class="rule thin"/><polygon points="300,99 570,68 570,156 300,125" class="cone"/><polygon points="300,99 570,109 570,115 300,125" class="cone-deep"/><circle cx="80" cy="112" r="42" class="sun-fill"/><circle cx="300" cy="112" r="13" class="body"/><path d="M 590 42 A 80 80 0 0 0 590 182" class="body"/><circle cx="568" cy="112" r="3.5" class="accent-2-fill"/><circle cx="600" cy="34" r="20" class="accent thin dotted"/><circle cx="600" cy="34" r="15" class="sun-fill"/><circle cx="600" cy="34" r="15.5" class="sky-fill"/><line x1="570" y1="106" x2="588" y2="50" class="accent-2 thin dotted"/><text x="574" y="38" text-anchor="end" class="label-dim">what they see</text><text x="80" y="180" text-anchor="middle" class="label">Light source</text><text x="80" y="195" text-anchor="middle" class="label-dim">the Sun</text><text x="300" y="151" text-anchor="middle" class="label">Blocking body</text><text x="300" y="166" text-anchor="middle" class="label-dim">the Moon</text><text x="540" y="196" text-anchor="middle" class="label">Observer</text><text x="540" y="211" text-anchor="middle" class="label-dim">on the Earth</text><text x="540" y="226" text-anchor="middle" class="label-dim">in the Moon&#x27;s shadow</text></svg>
