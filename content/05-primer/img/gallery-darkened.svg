<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Darkened: a body cuts the sunlight reaching another body</title><desc>Three panels. Left, lunar eclipse: the Sun, the Earth and its shadow cone, with the Moon inside the shadow; an observer on the Earth&#x27;s night side looks at it. Middle, eclipse of a satellite: the Sun, Jupiter and its shadow, with Io inside; the observer looks from elsewhere. Right, shadow transit: the Sun, Io between the Sun and Jupiter, and Io&#x27;s small shadow falling on Jupiter&#x27;s disc as a dark spot.</desc><line x1="226.67" y1="24" x2="226.67" y2="210" class="rule thin dotted"/><line x1="453.33" y1="24" x2="453.33" y2="210" class="rule thin dotted"/><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><circle cx="28" cy="110" r="13" class="accent-fill"/><polygon points="100,88 205,101 205,119 100,132" class="cone-deep"/><circle cx="100" cy="110" r="22" class="body"/><circle cx="175" cy="110" r="9" class="body"/><circle cx="175" cy="110" r="9" class="cone-deep"/><line x1="112" y1="127" x2="170" y2="116" class="accent-2 thin dotted"/><circle cx="112" cy="127" r="4" class="accent-2-fill"/><text x="100" y="114" text-anchor="middle" class="label-dim">Earth</text><text x="113.33" y="22" text-anchor="middle" class="label">Lunar eclipse</text><text x="113.33" y="192" text-anchor="middle" class="label-dim">the Moon in the Earth&#x27;s shadow</text><text x="113.33" y="206" text-anchor="middle" class="label-dim">same instant for everyone</text><circle cx="254.67" cy="110" r="13" class="accent-fill"/><polygon points="326.67,84 441.67,90 441.67,130 326.67,136" class="cone-deep"/><circle cx="326.67" cy="110" r="26" class="body"/><circle cx="401.67" cy="106" r="6" class="body"/><circle cx="401.67" cy="106" r="6" class="cone-deep"/><line x1="376.67" y1="172" x2="400.67" y2="112" class="accent-2 thin dotted"/><circle cx="376.67" cy="172" r="4" class="accent-2-fill"/><text x="326.67" y="114" text-anchor="middle" class="label-dim">Jupiter</text><text x="409.67" y="96" text-anchor="start" class="label-dim">Io</text><text x="340" y="22" text-anchor="middle" class="label">Eclipse of a satellite</text><text x="340" y="192" text-anchor="middle" class="label-dim">Io in Jupiter&#x27;s shadow</text><text x="340" y="206" text-anchor="middle" class="label-dim">seen from the Earth</text><circle cx="481.33" cy="110" r="13" class="accent-fill"/><circle cx="538.33" cy="104" r="6" class="body"/><polygon points="538.33,98 605.33,101 605.33,107 538.33,110" class="cone-deep"/><circle cx="628.33" cy="110" r="28" class="body"/><circle cx="605.33" cy="104" r="4.5" class="cone-deep"/><circle cx="605.33" cy="104" r="4.5" class="rule thin"/><line x1="583.33" y1="174" x2="603.33" y2="112" class="accent-2 thin dotted"/><circle cx="583.33" cy="174" r="4" class="accent-2-fill"/><text x="538.33" y="94" text-anchor="middle" class="label-dim">Io</text><text x="639.33" y="114" text-anchor="middle" class="label-dim">Jupiter</text><text x="566.67" y="22" text-anchor="middle" class="label">Shadow transit</text><text x="566.67" y="192" text-anchor="middle" class="label-dim">Io&#x27;s shadow on Jupiter&#x27;s</text><text x="566.67" y="206" text-anchor="middle" class="label-dim">cloud tops</text></svg>
