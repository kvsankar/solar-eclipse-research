<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" class="figsvg"><title>Hidden: the observer stands in the Moon&#x27;s umbra and the Sun is hidden</title><desc>Left, the Sun, labelled light source. Middle, the Moon, labelled blocking body. Behind the Moon a pale penumbra spreads out and a darker umbra narrows towards the Earth on the right, where both fall on the Earth&#x27;s surface. An observer, labelled observer, stands inside the umbra on the Earth. An inset above shows what the observer sees: a total eclipse, the Moon&#x27;s dark disc covering the Sun with a thin bright ring around it.</desc><text x="670" y="242" text-anchor="end" class="label-dim">Schematic, not to scale</text><line x1="80" y1="70" x2="300" y2="99" class="rule thin"/><line x1="80" y1="154" x2="300" y2="125" class="rule thin"/><polygon points="300,99 590,66 590,158 300,125" class="cone"/><polygon points="300,99 590,99 590,125 300,125" class="cone-deep"/><circle cx="80" cy="112" r="42" class="sun-fill"/><circle cx="300" cy="112" r="13" class="body"/><circle cx="660" cy="112" r="100" class="body"/><polygon points="559,100 565,101 565,123 559,124" class="cone-deep"/><circle cx="561" cy="112" r="3.5" class="accent-2-fill"/><circle cx="590" cy="34" r="22" class="accent thin dotted"/><circle cx="590" cy="34" r="17" class="sun-fill"/><circle cx="590" cy="34" r="15" class="sun-fill"/><circle cx="590" cy="34" r="15" class="silhouette-fill"/><line x1="561" y1="106" x2="580" y2="54" class="accent-2 thin dotted"/><text x="562" y="38" text-anchor="end" class="label-dim">what they see: totality</text><text x="80" y="180" text-anchor="middle" class="label">Light source</text><text x="80" y="195" text-anchor="middle" class="label-dim">the Sun</text><text x="300" y="151" text-anchor="middle" class="label">Blocking body</text><text x="300" y="166" text-anchor="middle" class="label-dim">the Moon</text><text x="510" y="182" text-anchor="middle" class="label">Observer</text><text x="510" y="197" text-anchor="middle" class="label-dim">on the Earth</text><text x="510" y="212" text-anchor="middle" class="label-dim">in the Moon&#x27;s umbra</text><text x="465" y="116" text-anchor="middle" class="label-dim">umbra</text></svg>
